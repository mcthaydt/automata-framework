# The secret scan over the full history (QB.1, `pnpm secrets`): gitleaks' default rules, plus one allowlisted
# folder. tooling/repo-hygiene/fixtures/secrets/ holds a planted fake key that the scan's self-test must find in
# a scratch repository; here it is expected and ignored.
title = "AutomataFramework gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "The planted fake key of the scan's own self-test"
paths = ['''^tooling/repo-hygiene/fixtures/secrets/''']

[[allowlists]]
description = "A content key path in a test's expected diagnostic, e.g. keyPath: 'effectors.handR.rot.0' (generic-api-key reads the word key; packages/3d, commit ed9d06d, M3.6b)"
condition = "AND"
regexTarget = "line"
regexes = ['''keyPath:\s*['"][A-Za-z0-9_.]+['"]''']
paths = ['''\.test\.ts$''']

[[allowlists]]
description = """The website's history, brought in with its subtree (site/, task 10.1; the Owner chose to allowlist it,
2026-11-06): its deploy-key check's fake OpenSSH key in tests/workflows.test.ts, that check's key-prefix pattern in
.github/workflows/ci.yml, and a sha256 file hash in src/data/api-index.json. None is a secret; the commits cannot change."""
commits = [
  "850d8b67468a68f5719247f3ef8dd7da9e809998",
  "c8231955d9ee13490cfd48e255bec8dbcd825bab",
  "350bc5c0e6b8e1a1acb859dffacfa4e77a5c89e2",
]

[[allowlists]]
description = """Content hashes in two generated records: every value in games/emberwick/words-sources.json is the sha256
of a source catalog's words (its ids keys_jump, keys_move and keys_pause carry the word key), and
docs/provenance/figures-manifest.json lists one sha256 per painter file (one path there is tests/api.test.ts).
generic-api-key reads the word key beside 64 hex digits. Only a line that is a 64-digit hex value in one of these two
files is let through."""
condition = "AND"
regexTarget = "line"
regexes = ['''"\s*:\s*"[0-9a-f]{64}"''']
paths = ['''^games/emberwick/words-sources\.json$''', '''^docs/provenance/figures-manifest\.json$''']
