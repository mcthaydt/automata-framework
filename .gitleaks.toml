# The secret scan over the full history (QB.1, `pnpm secrets`): gitleaks' default rules, plus one allowlisted
# folder. tooling/repo-hygiene/fixtures/secrets/ holds a planted fake key that the scan's self-test must find in
# a scratch repository; here it is expected and ignored.
title = "AutomataFramework gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "The planted fake key of the scan's own self-test"
paths = ['''^tooling/repo-hygiene/fixtures/secrets/''']

[[allowlists]]
description = "A content key path in a test's expected diagnostic, e.g. keyPath: 'effectors.handR.rot.0' (generic-api-key reads the word key; packages/figures, commit ed9d06d, M3.6b)"
condition = "AND"
regexTarget = "line"
regexes = ['''keyPath:\s*['"][A-Za-z0-9_.]+['"]''']
paths = ['''\.test\.ts$''']

[[allowlists]]
description = "The website's history, moved in by task 10.1 (63d3b360): a made-up OpenSSH key ('...secretsecret...') in tests/workflows.test.ts that checks the deploy-key guard, that guard's own text in .github/workflows/ci.yml, and a content hash in src/data/api-index.json. History is never rewritten, so the commits are listed (Owner's OK, 2026-11-07)."
commits = [
  '850d8b67468a68f5719247f3ef8dd7da9e809998',
  '350bc5c0e6b8e1a1acb859dffacfa4e77a5c89e2',
  'c8231955d9ee13490cfd48e255bec8dbcd825bab',
]
