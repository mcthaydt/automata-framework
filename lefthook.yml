pre-commit:
  piped: true
  commands:
    1_biome:
      glob: "*.{ts,js,json,jsonc}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    # The packages that own the staged files, and no other: the dependents of a changed package are the job of
    # `pnpm check` and the pull-request gate. Turbo's own `[HEAD]` filter still selects every package when the change
    # is in one the root workspace depends on (`@automata/tools` and what it pulls in), so the script maps the staged
    # files to packages itself. A commit that stages no file inside a package runs no unit tests.
    2_affected-unit-tests:
      run: pnpm exec node tooling/repo-hygiene/src/staged-unit-tests-cli.ts -- --testTimeout=90000
