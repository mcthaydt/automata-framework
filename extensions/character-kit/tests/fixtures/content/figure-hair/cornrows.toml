# `cornrows` from the figure library this kit grew out of; swatch names in kebab-case.

about = "Cornrows: rows plaited straight back from a clean hairline to the nape, few and fat enough that each is clear, each a chain of beads lit on their upper halves (a plait down its length), with the scalp (the skin's own tone) showing between them from the hairline back."
finish = "braid"

