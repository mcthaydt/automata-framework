# `quiffFade` from the figure library this kit grew out of; swatch names in kebab-case.

about = "A swept-back quiff over a skin fade: a crisp line-up at the brow and the temples; the sides and back cut close to the round skull, graded from the skin at the ears and the nape through two mixed tiers to the hair's own dark, up the back of the head to the crown, so from behind it reads as a fade, not a tail; the top a close shell combed back over the crown; and the quiff piecey locks rising from the hairline, highest at the middle and lower to the sides (a crest, not a block), uneven at their crests, lying back over the top and tapering to points on the crown, each parted from the next by its own shadow."
finish = "straight"

