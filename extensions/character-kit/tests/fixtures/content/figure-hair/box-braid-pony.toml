# `boxBraidPony` from FigureBuilder (mcthaydt/FigureBuilder) src/render/figure/library/hair.json at a1f7246; swatch names in kebab-case.

about = "Long box braids gathered into a high ponytail: a clean hairline high on the brow and lifted over the ears, the scalp dark between the braids, a few fat braided rows laid from it up to the tie on the crown (the front left low, so shades pushed up sit over them), a tie two texels tall in the chrome's mid, and a bundle of braids rising from it, arcing back and falling to the middle of the back, each its own rope parted from the next, with a matte plait down each, its beads alike on every braid and each lit on its upper half in a V (the strands crossing in from either side), and a thin cuff in the chrome's dark on every other one, staggered up their ends."
finish = "braid"

