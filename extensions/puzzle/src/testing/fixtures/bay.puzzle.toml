[[systemic]]
id = "porterAtFlame"
note = "A flame Ada holds up draws him to her (P1); put out, he goes to where it burned, warms 4 s and resumes his round (P10). Drawn from his desk, he leaves his keys on the hook (P7)."
via = [ "floor.lighter", "floor.torch", "combine.torch" ]
risk = "chase"

[[systemic.enables]]
fact = "keysAt"
is = "hook"

[[systemic]]
id = "porterInvestigating"
note = "A bottle thrown into the mortuary draws him there to search for 3 s (P3), keys in his pocket (P7)."
via = [ "floor.bottle" ]

[[systemic.enables]]
fact = "porterInside"
is = true

[[systemic]]
id = "porterLatched"
note = "Latched in the mortuary, he bangs on the door twice and is quiet: out of play for the rest of the act (P9). His keys come under the door."
via = [ "mortuaryDoor.latch" ]

[[systemic.enables]]
fact = "porterOut"
is = true

[[lethal]]
id = "porterTouch"
rule = "P5: within 0.65 m of Ada, he catches her; with the lighter and 20 s of fuel she can give him the flame instead (the grapple, once a minute), and he warms and lets her go."
