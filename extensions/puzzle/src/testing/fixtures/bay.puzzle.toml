[[systemic]]
id = "porterAtDrum"
note = "Warmth draws him (P1): the lit drum brings him from anywhere within 12 m. If he was sitting at his desk he hurries and leaves his keys on the hook (P7). While he warms there he ignores noise (P2)."
via = [ "drum.light", "drum.match", "drum.torch" ]
risk = "chase"

[[systemic.enables]]
fact = "porterAtDrum"
is = true

[[systemic.enables]]
fact = "keysAt"
is = "hook"

[[systemic]]
id = "porterAtBurner"
note = "The lit burner brings him into the mortuary from within 12 m (P1), keys left on the hook if he sat at the desk (P7); warming there he ignores noise (P2)."
via = [ "burner.light", "burner.match", "burner.torch" ]
risk = "chase"

[[systemic.enables]]
