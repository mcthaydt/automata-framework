[[rules]]
id = "crewGround"
text = "The crew's ground: only the street, its landing and steps, the yard and the exit way, never a room of the clinic: a step off it is refused and it holds where it stands (its `refuses`, src/game/crew.ts)."
when = []
then = []

[[rules]]
id = "crewSenses"
text = "The crew sense: it hears a noise within 4 m, sees Ada past furniture (not walls) within 5 m after the first 8 s of the walk, and notices a lit lighter or torch within 6 m (its transitions). Light does not repel it."
when = []
then = []

[[rules]]
id = "crewTouch"
text = "Touch: within 0.62 m of Ada, on its ground, it catches her; a lifted flame stands it off (the grapple). Nothing harms it. Once she is in at the exit it holds outside, never nearer than 1.5 m (its transitions, src/game/grapple.ts)."
when = []
then = []

[[rules]]
id = "crewSteps"
text = "The crew's wheels: while it walks, they tick on the ground every 0.7 s and carry 9 m (directional sound and a wall ring; nothing hears them)."
every = 0.7

[[rules.when]]
fact = "crewWalking"
is = true

[[rules.then]]
[rules.then.noise]
at = "crew"
loudness = 9
kind = "footfall"

[[rules]]
id = "crewAmbush"
text = "Once, after the first 8 s, with Ada past the steps (or crossing the yard) and the crew away, it appears at streetBack (the sting 0.6 s before, then a 2 s grace)."

[[rules.when]]
[rules.when.not]
fact = "crewCalming"
is = true

[[rules.when]]
fact = "crewCued"
is = true

[[rules.when]]
fact = "crewAway"
is = true

[[rules.when]]
[rules.when.not]
fact = "pursuit.ambushes.crewStreet"
is = true

[[rules.then]]
[rules.then.ambush]
id = "crewStreet"
agent = "crew"
mode = "ambush"
at = "streetBack"
sting = 0.6
grace = 2
then = "hunt"

[[rules.then]]
call = "crewSay"

[[rules]]
id = "crewOmens"
text = "Omens, once each: Ada hears its wheels from 9 m (her line), then sees its cap from 5 m in the open (her line, the second warning before the catch)."

[[rules.when]]
fact = "crewWalking"
is = true

[[rules.then]]
call = "crewOmen"

[[rules]]
id = "R1"
text = "Light repels: the Nurse flees any light that reaches her (Ada's flame, or a dawn she was not caught in) to the darkest reachable node, and will not step into one (her transitions)."
when = []
then = []

[[rules]]
id = "R2"
text = "Sound attracts: a noise draws her to it, unless she is fleeing, stunned or hunting (her transitions)."
when = []
then = []

[[rules]]
id = "R3"
text = "Sight hunts: in the dark, after the first 20 s, she sees Ada within 4.5 m past the walls, and chases her at 2.2 m/s (her transitions)."
when = []
then = []

[[rules]]
id = "grapple"
text = "The grapple: about to be caught with the lighter carried and 20 s of fuel in it, Ada holds the flame up and the Nurse steps back out of it; it costs 20 s of fuel (or all there is), snuffs the flame and vents the tension; for 3 s a touch is no catch; once a minute (her transitions, src/game/grapple.ts)."
when = []
then = []

[[rules]]
id = "dawnStun"
text = "The dawn hurts: caught in a room's dawn as it comes up, she shrieks and is stunned for 4 s, then keeps out of it (her transitions)."
when = []
then = []

[[rules]]
id = "R15"
text = "Light costs fuel: the lit lighter burns its fuel; the torch burns down without fuel."

[[rules.when]]
[rules.when.not]
fact = "light"
is = "off"

[[rules.then]]
call = "burnLight"

[[rules]]
id = "dawn"
text = "Dawn spreads: every 60 s the dawn comes up in the next room of DAWN's order (the ward, the corridor, the supply room, the hall, reception last), over 8 s; a room it has reached is safe."
when = []

[[rules.then]]
call = "dawn"

[[rules]]
id = "footsteps"
text = "Ada's footsteps make a small noise every 0.45 s while she walks."
when = []

[[rules.then]]
call = "footsteps"

[[rules]]
id = "steps"
text = "Steps through walls: while she walks, her footfalls carry 9 m every 0.6 s (directional sound and a wall ring; nothing hears them)."
every = 0.6

[[rules.when]]
fact = "nurseWalking"
is = true

[[rules.then]]
[rules.then.noise]
at = "nurse"
loudness = 9
kind = "footfall"

[[rules]]
id = "curtainAmbush"
text = "Once, after the first 20 s, with Ada in the ward before its dawn and the Nurse patrolling out of sight: she is behind the ward curtain, in the alcove (the sting 0.6 s before, then a 2 s grace)."

[[rules.when]]
[rules.when.not]
fact = "calm"
is = true

[[rules.when]]
fact = "adaInWard"
is = true

[[rules.when]]
fact = "nurseAway"
is = true

[[rules.when]]
fact = "wardDark"
is = true

[[rules.when]]
[rules.when.not]
fact = "pursuit.ambushes.curtain"
is = true

[[rules.then]]
[rules.then.ambush]
id = "curtain"
agent = "nurse"
mode = "ambush"
at = "alcove"
sting = 0.6
grace = 2
then = "hunt"

[[rules]]
id = "receptionAmbush"
text = "Once, after the first 20 s, with the reception door open before reception's dawn, with the Nurse patrolling out of sight: she is inside, behind the counter (the sting 0.6 s before, then a 2 s grace)."

[[rules.when]]
[rules.when.not]
fact = "calm"
is = true

[[rules.when]]
fact = "receptionOpen"
is = true

[[rules.when]]
fact = "nurseAway"
is = true

[[rules.when]]
fact = "receptionDark"
is = true

[[rules.when]]
[rules.when.not]
fact = "pursuit.ambushes.reception"
is = true

[[rules.then]]
[rules.then.ambush]
id = "reception"
agent = "nurse"
mode = "ambush"
at = "recepIn"
sting = 0.6
grace = 2
then = "hunt"

[[rules]]
id = "barricade"
text = "The bolt: drawn across the supply room door from inside, it shuts the door for everyone. The Nurse waits at it from 1.6 m, and comes back to it on her round if she gives up; after 5 s of waiting in all the bolt slides back by itself and the door eases open, without a sound (src/game/barricade.ts)."
when = []

[[rules.then]]
call = "barricade"

[[rules]]
id = "director"
text = "The pacing director: from 20 s after Ada comes back in, tension rises with the Nurse within 5 m of Ada, in the dark, on low fuel and at a crossing while she hunts, and falls in reception, hidden or walking lit. Held at 0.6 for 3 s it peaks (her round turns towards Ada); held at 0.85 for 3 s in the peak it vents into relief (she sits with Bed 04) for up to 20 s. Under 15 s of fuel, the flame is low (system:fuel.low)."
when = []

[[rules.then]]
call = "director"

