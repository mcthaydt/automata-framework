[[rules]]
id = "R1"
text = "Light repels: the Nurse flees any light that reaches her to the darkest reachable node, and will not step into one (her transitions)."
when = []
then = []

[[rules]]
id = "R2"
text = "Sound attracts: a noise draws her to it if she is within its loudness, unless she is fleeing, stunned, hunting or asleep (her transitions)."
when = []
then = []

[[rules]]
id = "R3"
text = "Sight hunts: in the dark she sees Ada within 4.5 m past the walls, and chases her at 2.2 m/s (her transitions)."
when = []
then = []

[[rules]]
id = "R4"
text = "Water conducts: throwing the breaker while a puddle touches the fuse box bangs, makes the touching puddles live for 6 s, and trips (the verbs fuseBox.seat and fuseBox.retry)."
when = []
then = []

[[rules]]
id = "R5"
text = "Electricity stuns: the Nurse in a live puddle is stunned for 8 s (her transitions)."
when = []
then = []

[[rules]]
id = "R7"
text = "Fire emits light: a burning curtain is a light of radius 3.2 m (the scene's lights)."
when = []
then = []

[[rules]]
id = "R10"
text = "Water extinguishes: a full basin poured on a burning curtain puts it out (the verbs curtainWest.douse and curtainEast.douse)."
when = []
then = []

[[rules]]
id = "R11"
text = "Fire reveals: a curtain burnt away or cut down uncovers the scratched code (the scratches hotspot)."
when = []
then = []

[[rules]]
id = "R13"
text = "Cloth mops: the cloth used on a puddle takes it away (the verb puddle.use); the leak brings it back while the valve is open."
when = []
then = []

[[rules]]
id = "grapple"
text = "The grapple: about to be caught with the lighter carried and 20 s of fuel in it, Ada holds the flame up and the Nurse steps back out of it; it costs 20 s of fuel (or all there is), snuffs the flame and vents the tension; for 3 s a touch is no catch; once a minute (her transitions, src/game/grapple.ts)."
when = []
then = []

[[rules]]
id = "R14"
text = "Power lights: the fuse seated with a dry fuse box powers the lamps and the exit, and puts the Nurse to sleep (the verbs fuseBox.seat and fuseBox.retry)."
when = []
then = []

[[rules]]
id = "R15"
text = "Light costs fuel: the lit lighter burns its fuel; the torch burns down without fuel."

[[rules.when]]
[rules.when.not]
fact = "light"
is = "off"

[[rules.then]]
call = "burnLight"

[[rules]]
id = "R8"
text = "Fire spreads: a curtain burning longer than 4 s lights the other; after 24 s it is ash."
when = []

[[rules.then]]
call = "fire"

[[rules]]
id = "R9"
text = "Fire alarm: a fire burning longer than 9 s sounds the alarm at the ward every 3 s until it is out."
when = []

[[rules.then]]
call = "fireAlarm"

[[rules]]
id = "monitorAlarm"
text = "The bedside monitor's alarm beeps every 1.5 s while it runs."
when = []

[[rules.then]]
call = "monitorBeep"

[[rules]]
id = "R12"
text = "Valve drains: with the valve shut the leak's puddle shrinks away; while it is open a mopped or scooped puddle grows back. Live water dies down."
when = []

[[rules.then]]
call = "leak"

[[rules]]
id = "sparks"
text = "The sparks at the fuse box after a short die down."
when = []

[[rules.then]]
call = "sparks"

[[rules]]
id = "R6"
text = "Electricity kills: Ada in a live puddle is caught."

[[rules.when]]
fact = "adaInLiveWater"
is = true

[[rules.then]]
[rules.then.emit]
caught = "shock"

[[rules]]
id = "footsteps"
text = "Ada's footsteps make a small noise every 0.45 s while she walks."
when = []

[[rules.then]]
call = "footsteps"

[[rules]]
id = "sighting"
text = "The first time Ada walks into the corridor she sees the Nurse, who wakes."

[[rules.when]]
fact = "sighted"
is = false

[[rules.when]]
fact = "adaPastSightingLine"
is = true

[[rules.then]]
set = "sighted"
to = true

[[rules.then]]
call = "wake"

[[rules.then]]
[rules.then.emit]
cutscene = "sighting"

[[rules]]
id = "corridorAmbush"
text = "Once, after a first fuse attempt that shorts: with Ada in the north corridor and the Nurse patrolling out of sight, she is in the emergency exit's doorway (the sting 0.6 s before, then a 2 s grace)."

[[rules.when]]
fact = "fuseSeated"
is = true

[[rules.when]]
fact = "power"
is = false

[[rules.when]]
fact = "adaInCorridor"
is = true

[[rules.when]]
fact = "nurseAway"
is = true

[[rules.when]]
[rules.when.not]
fact = "pursuit.ambushes.corridor"
is = true

[[rules.then]]
[rules.then.ambush]
id = "corridor"
agent = "nurse"
mode = "ambush"
at = "end"
sting = 0.6
grace = 2
then = "hunt"

[[rules]]
id = "wetFeet"
text = "Water leaves the Nurse's prints: she is wet for 6 s after standing in a puddle."

[[rules.when]]
[rules.when.not]
mode = "dormant"
agent = "nurse"

[[rules.then]]
call = "wetFeet"

[[rules]]
id = "barricade"
text = "The bolt: drawn across the open supply room door from inside, it shuts the door for everyone. The Nurse waits at it from 1.6 m, and comes back to it on her round if she gives up; after 5 s of waiting in all the bolt slides back by itself and the door eases open, without a sound (src/game/barricade.ts)."
when = []

[[rules.then]]
call = "barricade"

[[rules]]
id = "director"
text = "The pacing director: from 20 s into the scene, tension rises with the Nurse within 5 m of Ada, in the dark, on low fuel and at a crossing while she hunts, and falls in reception, hidden or walking lit. Held at 0.6 for 3 s it peaks (her round turns towards Ada); held at 0.85 for 3 s in the peak it vents into relief (she sits with Bed 04) for up to 20 s. Under 15 s of fuel, the flame is low (system:fuel.low)."
when = []

[[rules.then]]
call = "director"

