# The adventure source's bay line text (en) (provenance: the framework's docs/provenance/sources.md), converted once
# by packages/narrative/scripts/convert-adventure-narrative.ts. Do not edit.
"bay.arrivalDoor" = "The clinic door. It locked behind me, and there is no handle on this side."
"bay.ambulanceFirst" = "The rear doors hang open. On the stretcher, a clipboard with a run sheet. Under it, a box of matches and a can of petrol."
"bay.runSheet" = "RUN SHEET  21.01.87\nCALL 04:09  ST. AGNES WARD\nPT: VOSS, A. (STAFF NURSE)\nFOUND AT BED 04\nDOA 04:17"
"bay.drum" = "An oil drum, cut down for a brazier. Black inside, and empty. It would take a can of something."
"bay.drumEmpty" = "There is nothing in it to burn."
"bay.drumFull" = "It is already soaked. It only needs a flame."
"bay.drumSpirit" = "I pour the spirit over the old ash. The smell makes my eyes water."
"bay.drumPetrol" = "I empty the petrol into the drum."
"bay.drumFluid" = "I squeeze the lighter fluid into the drum. It will do."
"bay.drumLit" = "The drum goes up with a soft thump. Heat on my face. Somewhere behind me, a chair scrapes back."
"bay.drumBurning" = "It roars. I should not stand this close, or stay where he will come to warm his hands."
"bay.drumDoused" = "The water hisses and the fire dies to steam."
"bay.burner" = "A gas ring on a steel bench, the kind they boil instruments on. The tap is stiff."
"bay.burnerLit" = "Blue flame, with a hiss. The cold room is suddenly the warmest place in the building."
"bay.burnerOn" = "It is lit. The ring hisses."
"bay.burnerOff" = "I close the tap. The blue ring shrinks and goes out."
"bay.shutterLocked" = "A roller shutter, chained to a ring in the floor. The padlock is the size of my fist. Grey light leaks under it."
"bay.padlockOff" = "The third key fits. The padlock drops and the chain runs loose."
"bay.crank1" = "I crank the handle. The shutter shrieks up a hand’s width. The noise fills the bay."
"bay.crank2" = "Again. It screams on its rails. Cold grey air under it now, up to my knees."
"bay.crank3" = "Once more. The shutter clatters up into its drum. Grey air, and the street."
"bay.shutterOpen" = "Open."
"bay.mortuaryDoor" = "A steel door with a drop latch on this side. MORTUARY."
"bay.mortuaryLatch" = "I swing the door shut and drop the latch."
"bay.latchInside" = "Not from in here."
"bay.mortuaryQuiet" = "Quiet now. I leave the latch where it is. I tell myself he does not mind."
"bay.keysUnderDoor" = "His keys, pushed under the door. Three of them on a ring, with a brass tag: F. LAMB."
"bay.keyHook" = "A hook by the door with a paper tag: KEYS. Empty."
"bay.keysTaken" = "I lift the ring off the hook. Three keys, and a brass tag: F. LAMB. He did not hear."
"bay.ledger" = "MORTUARY LEDGER  21.01.87\n04:17  RECEIVED  VOSS, A.  FROM BED 04  DRAWER 4\nRELEASE AT FIRST LIGHT.\nThe same line on every page, in the same careful hand.\nThe RELEASED column is empty."
"bay.officeNotice" = "PORTER: KEYS ON THE HOOK WHILE YOU SIGN IN.\nUnder it, in pencil: Mind his hands. He goes by touch."
"bay.drawer4" = "Drawer 4 rolls out on cold runners. Empty. A toe tag on a string: A. VOSS.\nSomeone has made it up like a bed. The corners are square."
"bay.mortuarySign" = "DO NOT LEAVE THE BURNER ON.\nHE SITS BY IT ALL NIGHT."
"bay.spiritTake" = "A brown bottle of methylated spirit, nearly full."
"bay.fluidTin" = "A small tin of lighter fluid by the heater, half full. I take it."
"bay.shelfEmpty" = "Gauze, labels, a box of toe tags."
"bay.sink" = "A steel sink. The tap runs ice cold."
"bay.sinkFill" = "I fill the basin. The water aches in my hands."
"bay.sinkFull" = "The basin is already full."
"bay.trolley" = "A body trolley under a grey shroud. The shroud is stitched to the frame, in small careful stitches, like someone mending a coat."
"bay.shroudCut" = "I cut the shroud free. It is heavy cotton, and dry. I say sorry to nobody."
"bay.trolleyBare" = "Just the frame now."
"bay.flash" = "I hold up the flame and let it burn."
"bay.flashTorch" = "I hold the torch up high."
"bay.noEffect" = "That does nothing."
"bay.lighterEmpty" = "The lighter sputters. Out of fuel."
"bay.torchOut" = "The rag torch burns down to ash."
"bay.haveTorch" = "One torch is all I can carry lit."
"bay.combineTorch" = "I wrap the cloth around a length of pipe and light it. A rag torch."
"bay.combineFluid" = "I refill the lighter."
"bay.throw" = "The bottle shatters. The sound goes on for a long time."
"bay.pour" = "I pour the water out."
"bay.crewWheels" = "Wheels on tile, out in the yard. Not mine."
"bay.crewCap" = "A peaked cap at the gate. They have come about the call."
"bay.ledgerAsk" = "The pen hangs on a string. Under his last line there is room for one more name."
"bay.ledgerSign" = "Sign it."
"bay.ledgerLeave" = "Not now."
"bay.ledgerSigned" = "MORTUARY LEDGER  21.01.87\n04:17  RECEIVED  VOSS, A.  DRAWER 4\nSIGNED  A. Voss\nRELEASED:"
"bay.porter.routine.1" = "Cold. Always so cold down here. Any little flame, and there I am."
"bay.porter.routine.2" = "Desk, drum, drawers, door. Desk, drum, drawers, door."
"bay.porter.routine.3" = "Keys on the hook while I sign in. Always the hook, then the pen, then the hook, then the pen."
"bay.porter.routine.4" = "There. You’re in the book. Now, where was I? Where was I."
"bay.porter.routine.5" = "Three keys on my ring. The desk, the drawers, the padlock on the shutter. I count them in my pocket, every round."
"bay.porter.signing.1" = "Another for the book. Voss, A. Staff nurse. Let me get you down, love."
"bay.porter.signing.2" = "Hush now, hush. The book first, then I’ll see to you, then the kettle."
"bay.porter.stirring.1" = "Is someone warm in here?"
"bay.porter.stirring.2" = "I can smell it. Somebody’s been kind to me."
"bay.porter.drawn.1" = "Somebody’s lit something. Oh, that’s kind."
"bay.porter.drawn.2" = "I can feel that from here. Hold it there, love, I’m coming."
"bay.porter.drawn.3" = "Give it here, love, whatever it is that’s warm. I only want my hands round it. Then you can go."
"bay.porter.warming.1" = "Not now. Not now, I’m nearly warm."
"bay.porter.warming.2" = "Let them bang. Let me have this. Just this."
"bay.porter.warming.3" = "Gone out. They all go out, in the end."
"bay.porter.investigate.1" = "Who’s that? The crew’s not due. Come here, love, let me feel your face."
"bay.porter.investigate.2" = "Hello? I heard you. I don’t need eyes to find you, only hands."
"bay.porter.searching.1" = "My keys… Who’s had my keys?"
"bay.porter.searching.2" = "I’ll find them by touch, love. I always do. I found you once, didn’t I? Up on the ward."
"bay.porter.latched.1" = "Quiet in here. I can hear the river. I can hear you breathing, too, love. You needn’t hold it."
"bay.porter.latched.2" = "Go on, love. I’ll be here at first light. I always am."
"bay.crew.patrol.1" = "Echo Four to Control. Still looking for the patient from Bed 04."
"bay.crew.patrol.2" = "Control, Echo Four. The sheet’s still open. Do you copy?"
"bay.crew.investigate.1" = "Control, Echo Four. Something moved. Going to look."
"bay.crew.investigate.2" = "Hello? It’s the ambulance."
"bay.crew.hunt.1" = "Stay where you are. We’ll take you down, nice and easy."
"bay.crew.hunt.2" = "Wait there. It’s only the ambulance."
"bay.crew.follow.1" = "Through here, is she? All right. Mind the door."
"bay.crew.follow.2" = "Easy, now. I’ll come through after you."
"bay.crew.hold.1" = "Echo Four to Control. Patient’s inside. We’ll wait."
"bay.crew.hold.2" = "Control, Echo Four. Do you receive me? Control?"
"bay.crew.ambush.1" = "Echo Four to Control. Call 04:09, St. Agnes ward. Arriving now."
"bay.crew.ambush.2" = "Control, this is Echo Four. Control?"
"bay.cutscene.grapple.1" = "Oh. That’s warm."
"bay.cutscene.grappleCrew.1" = "Control, Echo Four. Patient’s on her feet, and she’s got a light. We’ll hold."
"bay.cutscene.arrival.1" = "The door locks behind me. It is colder out here than the night was."
"bay.cutscene.arrival.2" = "On the stretcher, a run sheet. PT: VOSS, A. (STAFF NURSE). DOA 04:17."
"bay.cutscene.arrival.3" = "Cold. Always so cold. Any little flame, and I come to it like a moth."
"bay.cutscene.latched.1" = "Two slow bangs on the door. Then nothing."
"bay.cutscene.latched.2" = "All right. I’ll wait in here, then. I’m used to waiting."
"bay.cutscene.dawn.1" = "The shutter rises on grey. It is not light yet."
"bay.cutscene.dawn.2" = "On the desk the ledger lies open at 04:17. The RELEASED column is empty."
"bay.cutscene.dawn.3" = "Not yet. Not quite light."
"bay.cutscene.dawn.4" = "It isn’t light yet."
"bay.cutscene.dawn.5" = "The street is grey and empty. At the end of it, the clinic."
"bay.cutscene.dawn.6" = "I should get back."
"bay.cutscene.dawn.7" = "Is this it?"
"bay.item.lighter.name" = "Lighter"
"bay.item.lighter" = "A dented brass lighter. Not mine, but it fits my hand. Light it to keep her back. The fuel will not last."
"bay.item.basin.name" = "Kidney basin"
"bay.item.basin" = "An enamel basin. It can carry water from the sink or a puddle, and pour it anywhere."
"bay.item.scalpel.name" = "Scalpel"
"bay.item.scalpel" = "Clean, and very sharp. Good for cutting cloth. Not for fighting her."
"bay.item.cloth.name" = "Curtain cloth"
"bay.item.cloth" = "A strip of heavy shroud cotton. It could soak up water, or burn for a long time with a flame."
"bay.item.torch.name" = "Rag torch"
"bay.item.torch" = "Cloth wrapped around a length of pipe and set alight. A wide light that costs no fuel."
"bay.item.bottle.name" = "Glass bottle"
"bay.item.bottle" = "An empty saline bottle. Throw it at the floor and anything listening will come."
"bay.item.brassKey.name" = "Brass key"
"bay.item.brassKey" = "Paper tag: SUPPLY. It is still warm."
"bay.item.fuse.name" = "Ceramic fuse"
"bay.item.fuse" = "A heavy emergency fuse. The label is in my handwriting: for when I finally leave."
"bay.item.fluid.name" = "Lighter fluid"
"bay.item.fluid" = "Half a can of naphtha. Combine it with the lighter."
"bay.item.matches.name" = "Matches"
"bay.item.matches" = "A box of ambulance matches. Three left."
"bay.item.spirit.name" = "Methylated spirit"
"bay.item.spirit" = "A brown bottle of spirit. It burns blue and hot."
"bay.item.petrol.name" = "Petrol can"
"bay.item.petrol" = "A red can, a third full. It sloshes."
"bay.item.keys.name" = "Porter’s keys"
"bay.item.keys" = "Three keys on a ring with a brass tag: F. LAMB. The ring is ice cold."
"bay.caught.porter.title" = "He found you."
"bay.caught.porter" = "Cold hands. “There you are, Drawer Four.”"
"bay.caught.crew.title" = "The crew found you."
"bay.caught.crew" = "Echo Four to Control. Patient located. Bringing her down."
"bay.objective.start" = "The shutter is the way out. It is chained."
"bay.objective.keys" = "Get the Porter’s keys for the padlock."
"bay.objective.unlock" = "Open the padlock with his keys."
"bay.objective.crank" = "Crank the shutter open. It will be loud."
"bay.porter.c1.hear" = "Who’s that? No, don’t tell me, let me, let me. Too light on your feet for the crew, the crew come down those steps like furniture."
"bay.porter.c1.cold" = "I don’t see, love. Not for a long time now. But the cold moves when somebody comes in, it shifts over to make room, like on a bus."
"bay.porter.c1.ask" = "So. Are you staff, love, or are you for me?"
"bay.porter.c1.inner" = "He is looking right at you. No. Just past you, at the place you were a second ago."
"bay.porter.c1.staff" = "Staff. I’m on nights."
"bay.porter.c1.unsure" = "I don’t know yet."
"bay.porter.c1.yours" = "I think I’m for you."
"bay.porter.c1.staffReply" = "Nights. Course you are. Me too, all my life, and I still put the kettle on at four like it means something."
"bay.porter.c1.unsureReply" = "That’s all right, that’s all right. Nobody knows, the first time down. They stand where you’re standing and pat their pockets."
"bay.porter.c1.yoursReply" = "Well. There’s a drawer for everyone down here, and I keep them nice. Have a look round, and don’t mind the knocking, it’s only the pipes."
"bay.porter.c2.glove" = "Hold on, hold on. The glove has to come off for this, and it costs me, in this cold. I read the book by the grooves the pen leaves."
"bay.porter.c2.read" = "Oh-four-seventeen. Received. Voss, A., from Bed Four. Drawer Four. Release at first light."
"bay.porter.c2.empty" = "Every night I write you in, and every morning that column’s empty. Every night. You’d think I’d learn."
"bay.porter.c2.inner" = "Your name, in his mouth, read off the page with his fingers. Like someone reading a headstone in the dark."
"bay.porter.c2.ask" = "You never come down for it. Why’s that?"
"bay.porter.c2.shift" = "I’m still on shift."
"bay.porter.c2.nobody" = "Nobody came to take over."
"bay.porter.c2.here" = "I’m here now."
"bay.porter.c2.shiftReply" = "Still on, still on. The ward’s quiet, I expect. It always is, this hour, and that’s what gets you, the quiet."
"bay.porter.c2.nobodyReply" = "No. Nobody comes at that hour, not for you, not for me, not for any of my sleepers. I used to mind."
"bay.porter.c2.hereReply" = "So you are, so you are. And not quite light yet, so there’s no hurry. There’s never any hurry, down here."
"bay.porter.c2.byeNurse" = "Go careful, Nurse."
"bay.porter.c2.byeAda" = "Go careful, Ada."
"bay.porter.c2.byeDrawer" = "Go careful, Drawer Four."
"bay.porter.c3.hiNurse" = "There you are, Nurse. Come and stand by this."
"bay.porter.c3.hiAda" = "There you are, Ada. Come and stand by this."
"bay.porter.c3.hiDrawer" = "There you are, Drawer Four. Come and stand by this."
"bay.porter.c3.river" = "There’s a river behind the yard. You’ll have heard it, nights like this, going on under the ice like somebody talking in the next room."
"bay.porter.c3.keeps" = "It keeps nothing, that river. Not a leaf, not a ring, not a name. That’s why it’s never sad."
"bay.porter.c3.kindness" = "Everything goes out at first light, and that’s a kindness, whatever they tell you. I put my sleepers to bed, and in the morning I let them go."
"bay.porter.c3.inner" = "He has said this before. To someone else, in exactly this order, and he will say it again tomorrow."
"bay.porter.c3.ask" = "You’re warm. I can feel it from here. Will you sit a while, or will you go out with the light?"
"bay.porter.c3.stay" = "Someone has to stay with her."
"bay.porter.c3.tell" = "I want to tell someone first."
"bay.porter.c3.go" = "I’ll go out with the light."
"bay.porter.c3.stayReply" = "Her. There’s always a her, up on the ward, somebody who wants the light left on. I’ll keep your drawer nice, then."
"bay.porter.c3.tellReply" = "Tell who? Nobody comes at six. There’s only me, love, and I can’t see to read it."
"bay.porter.c3.goReply" = "That’s you, then. Go on, go on, before I start talking again. I’ll have the book open."
"bay.st.sys.fuel.low" = "The flame is shrinking. I need fuel for it, or I do the rest of this in the dark."
"bay.st.sys.grapple.porter" = "Go on, then. I’ve got what I wanted."
"bay.st.p2.lighter" = "The flame leans toward him before he moves. His lighter: F.L.\nHe has never once asked me for it back."
"bay.st.p2.drawer" = "The tag again, after the ledger. The same name in the same careful hand: received 04:17, from Bed 04, drawer 4. Whoever made this bed up knew I was coming."
"bay.register.warmthDrawsHim" = "What brings him from his desk"
"bay.register.keysOnHook" = "His keys"
"bay.register.keysFitPadlock" = "The padlock on the shutter"
"bay.register.crankSafely" = "The noise of the crank"
"bay.radio.time" = "This is the night programme. The time is seventeen minutes past four. It was seventeen minutes past four last time I looked, as well, but there you are."
"bay.radio.weather" = "A hard frost across the county tonight, clear skies, not a breath of wind. First light at 06:02."
"bay.radio.eve" = "It’s St. Agnes’ Eve, for those who keep count. The old custom was to sit up all night and watch for what’s coming. Keats wrote about it. “The owl, for all his feathers, was a-cold.”"
"bay.radio.request" = "A request now, for the night staff at St. Agnes. It just says: for Ada, on nights. It doesn’t say who it’s from."
"bay.radio.letter" = "A listener writes: my mother kept a lamp on for my father every night he worked. After he’d gone, she kept it on anyway. Was that silly? No, love. I don’t think it was. But I hope someone came and turned it off for her, in the end."
"bay.radio.signOff" = "That’s us till first light. If you’re working through, someone will be along in the morning. Someone always says that, don’t they."
