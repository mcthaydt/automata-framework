# The clinic line text (en) (provenance: the framework's docs/provenance/sources.md), converted once from an earlier game. Do not edit.
"clinic.bedFirst" = "Bed 04. The sheets are still warm, shaped like me. My wristband reads A. VOSS.\nUnder the pillow, a scalpel. Somebody put it there for me. Somebody thought I would need it."
"clinic.bed" = "Bed 04. I do not want to lie down again."
"clinic.monitorFirst" = "ST. AGNES / BED 04\nPATIENT: VOSS, A.  ADMITTED 04:17\nThere is a red button marked ALARM."
"clinic.monitorAlarm" = "I press ALARM. The monitor shrieks across the ward, and keeps shrieking, and nobody comes."
"clinic.monitorBusy" = "It is already screaming. It has been screaming for years. You just stopped hearing it."
"clinic.curtain" = "A heavy curtain on a rail. Behind it, something has been scratched into the plaster, low down. Where a child would reach. Or someone on her knees."
"clinic.curtainBurning" = "It is burning. I should not stand this close. I stand this close."
"clinic.curtainGone" = "Only the rail is left. The rings are still swinging a little."
"clinic.curtainCut" = "I cut the curtain down. The cloth is heavy and dry."
"clinic.curtainLit" = "The curtain catches at once. The ward fills with orange light, and for a second it looks like somebody’s home."
"clinic.scratches" = "0417 0417 0417 0417\nSHE KEEPS THE KEYS BEHIND THE DESK"
"clinic.record" = "PATIENT RECORD\nADMISSION 04:17. No name. No pulse.\nThe patient asked us to leave the lights on."
"clinic.register" = "NIGHT REGISTER\nEvery night shift since 1987 is signed A. Voss.\nIt is my handwriting."
"clinic.noticeboard" = "STAFF NOTICE\nThe Night Nurse does not like the light.\nDo not make noise near the north corridor."
"clinic.clock" = "The clock stopped at 04:17. The second hand twitches and goes nowhere."
"clinic.cabinetOpen" = "The cabinet is empty now. Empty the way a house is, after."
"clinic.nightstandBasin" = "A kidney basin, dry."
"clinic.nightstandBottle" = "An empty saline bottle rolls out of the drawer."
"clinic.nightstandEmpty" = "Nothing else. A hair tie I do not remember owning. It is my colour."
"clinic.trolleyBottle" = "A saline bottle, empty."
"clinic.trolleyEmpty" = "Gauze and rust."
"clinic.sinkFill" = "Rust-coloured water fills the basin."
"clinic.sink" = "The tap coughs out rusty water, clears, then coughs again, as if it is trying to say something."
"clinic.sinkFull" = "The basin is already full."
"clinic.doorLocked" = "Locked. The keyhole is brass."
"clinic.doorOpened" = "The brass key turns. The supply room smells of bleach and wet concrete."
"clinic.doorOpen" = "The supply room door stands open."
"clinic.shelfFuse" = "A ceramic fuse and a can of lighter fluid."
"clinic.shelfEmpty" = "Bandages, bleach, nothing useful."
"clinic.valveShut" = "I wrench the valve shut. The pipe in the corridor stops dripping."
"clinic.valveDone" = "The valve is closed."
"clinic.fuseEmpty" = "EMERGENCY POWER. The fuse socket is empty.\nThe floor under the box is flooded."
"clinic.fuseDry" = "EMERGENCY POWER. The fuse socket is empty."
"clinic.fuseShort" = "The breaker bangs. Blue light crawls across the water, then the breaker trips. My teeth ache."
"clinic.fusePower" = "The fuse seats with a click. Somewhere behind the walls, a machine begins to breathe."
"clinic.fuseOn" = "Emergency power is on."
"clinic.puddle" = "Cold water from the leaking pipe. It is spreading toward the fuse box."
"clinic.puddleMopped" = "The cloth soaks up the water."
"clinic.puddleFill" = "I scoop water into the basin."
"clinic.pour" = "I pour the water out."
"clinic.scrawl" = "Scratched into the paint, low down, like a child did it:\nTHERE WAS NEVER A NIGHT SHIFT.\nTHEN WHO SIGNS THE REGISTER?"
"clinic.exitLocked" = "The electric lock is dead. Emergency power must be off."
"clinic.douse" = "The water hisses. The fire is out."
"clinic.noEffect" = "That does nothing."
"clinic.lighterEmpty" = "The lighter sputters. Out of fuel. Of course it is."
"clinic.torchOut" = "The rag torch burns down to ash. The dark comes back all at once, as if it was waiting just outside."
"clinic.combineTorch" = "I wrap the cloth around a bed rail and light it. A rag torch."
"clinic.combineFluid" = "I refill the lighter."
"clinic.throw" = "The bottle shatters. The sound goes on for a long time."
"clinic.keypadWrong" = "The keypad buzzes. Wrong code. It sounds disappointed in me."
"clinic.keypadRight" = "The keypad chimes. Inside the cabinet: a brass key on a paper tag."
"clinic.item.lighter.name" = "Lighter"
"clinic.item.lighter" = "A dented brass lighter. Not mine, but it fits my hand. Light it to keep her back. The fuel will not last."
"clinic.item.basin.name" = "Kidney basin"
"clinic.item.basin" = "An enamel basin. It can carry water from the sink or a puddle, and pour it anywhere."
"clinic.item.scalpel.name" = "Scalpel"
"clinic.item.scalpel" = "Clean, and very sharp. Good for cutting cloth. Not for fighting her."
"clinic.item.cloth.name" = "Curtain cloth"
"clinic.item.cloth" = "A strip of heavy curtain. It could soak up water, or burn for a long time with a flame."
"clinic.item.torch.name" = "Rag torch"
"clinic.item.torch" = "Curtain cloth wrapped around a bed rail and set alight. A wide light that costs no fuel."
"clinic.item.bottle.name" = "Glass bottle"
"clinic.item.bottle" = "An empty saline bottle. Throw it at the floor and anything listening will come."
"clinic.item.brassKey.name" = "Brass key"
"clinic.item.brassKey" = "Paper tag: SUPPLY. It is still warm."
"clinic.item.fuse.name" = "Ceramic fuse"
"clinic.item.fuse" = "A heavy emergency fuse. The label is in my handwriting: for when I finally leave."
"clinic.item.fluid.name" = "Lighter fluid"
"clinic.item.fluid" = "Half a can of naphtha. Combine it with the lighter."
"clinic.caught.nurse.title" = "She found you."
"clinic.caught.nurse" = "Cold hands. A voice that sounds like yours: \"Back to bed, Ada.\""
"clinic.caught.shock.title" = "The water was live."
"clinic.caught.shock" = "Blue light, then nothing. Somewhere a breaker resets."
"clinic.registerAsk" = "A clean line under all the others. SIGNED ON, HANDED OVER TO."
"clinic.registerSign" = "Sign on."
"clinic.registerLeave" = "Not now."
"clinic.registerSigned" = "NIGHT REGISTER\n20.01.87   SIGNED ON 20:00   A. Voss\nHANDED OVER TO:"
"clinic.st.sys.fuel.low" = "The flame has gone small and blue at the root. Not long now. When it goes out, nothing keeps her back."
"clinic.st.sys.grapple.nurse" = "I held the flame up into her face and she stepped back out of it. Then it went out in my hand. Most of the fuel, gone. It will not work twice in a row."
"clinic.st.sys.barricade.set" = "The bolt is stiff, but it goes across. A door between us. She has never needed a door to wait."
"clinic.st.sys.barricade.open" = "No knock. Nothing at all. Then the bolt slides back by itself, slowly, and the door eases open. As if it was only ever hers to lock."
"clinic.st.sys.decoy.wheelchair" = "From the door I took it for someone sitting up, waiting to be seen. A shape with its back to me. Nobody in it. Nobody’s face to see."
"clinic.st.p1.sheets" = "Bed 04, under the lights now. The sheets have kept my shape, and they are still warm. As if I only got up a minute ago. As if I never did."
"clinic.st.p1.desk.1" = "The desk lamp, the register, a minute with nothing coming. Every line in it is in my hand. Sitting here changes none of them. It is only quiet."
"clinic.st.p1.desk.2" = "I sit a while longer. Nobody comes to take over. You knew nobody would. Sit anyway."
"clinic.st.p1.desk.3" = "The pen is where my hand expects it. I leave it there. Signing on would only make it another night."
"clinic.st.p1.scrawl" = "Who signs the register? You do. You always have. That is not an answer, and you know it."
"clinic.st.p1.threshold" = "The exit sign is lit at the end of the corridor. For when I finally leave. I wrote that on a fuse, once. I think I meant tonight."
"clinic.register.code" = "The cabinet’s four numbers"
"clinic.register.brassKey" = "The brass key"
"clinic.register.needsFuse" = "The dead lock on the exit"
"clinic.register.dryFirst" = "The water under the fuse box"
"clinic.register.exitPower" = "When the power comes back"
"clinic.inspectLighter" = "Scratched into the base: F.L.\nNot my initials."
"clinic.inspectBrassKey" = "On the back of the tag, in pencil: BED 04."
"clinic.inspectFuse" = "The label, close: for when I finally leave.\nMy handwriting. I do not remember writing it."
"clinic.wheelchair" = "A wheelchair, turned to face the wall. Empty."
"clinic.boltDrawn" = "I draw the bolt back. The door swings in on its own weight."
"clinic.openingAsk" = "At 04:17, where was I? Think. Someone was in this bed and someone was beside it, and I was one of them."
"clinic.openingDuty" = "I was working."
"clinic.openingUnsure" = "I don’t remember which."
"clinic.openingAsleep" = "I was asleep."
"clinic.openingDutyReact" = "Then who was in this bed before me? Somebody tucked these corners the way I tuck them. Tight, so she couldn’t get up."
"clinic.openingDutyInner" = "You know who. You turned her pillow every hour, on the hour. Count the hours."
"clinic.openingUnsureReact" = "Both sound like me."
"clinic.openingUnsureInner" = "That is the part you don’t like."
"clinic.openingAsleepReact" = "Then someone was meant to be watching me."
"clinic.openingAsleepInner" = "Someone was. Listen. Her shoes, out in the corridor, going away and coming back. Going away and coming back."
"clinic.nurse.power" = "If you go, who sits up with her?"
"clinic.powerBack" = "I’ll come back."
"clinic.powerSilent" = "I don’t answer."
"clinic.powerElse" = "Someone else can."
"clinic.powerBackInner" = "You said that the first night, too. Look where you are."
"clinic.powerSilentInner" = "She waits. She has always been better at waiting than you."
"clinic.powerElseInner" = "Someone else. Name one. Go on. Name one person who came."
"clinic.registerFirstNight" = "NIGHT REGISTER   1979\nSIGNED ON 20:00   A. Voss\nFirst night. All quiet.\nHANDED OVER TO:"
"clinic.registerNights" = "SIGNED ON 20:00   A. Voss\nSIGNED ON 20:00   A. Voss\nOne name on every line, the same slope, the same weight on the pen. Nothing under HANDED OVER TO. Nobody has even crossed it out."
"clinic.registerLastDate" = "20.01.87   SIGNED ON 20:00   A. Voss\nBed 04 asks for the lights on.\nHANDED OVER TO:\nEvery line after this one carries the same date. The last one is still wet."
"clinic.cutscene.opening.1" = "St. Agnes Clinic. 04:17."
"clinic.cutscene.grapple.1" = "Get back from me."
"clinic.cutscene.opening.2" = "I was asleep. Wasn’t I? The monitor says my name."
"clinic.cutscene.opening.3" = "Someone is walking in the north corridor."
"clinic.cutscene.opening.4" = "Hello? …Nurse?"
"clinic.cutscene.opening.5" = "The exit is at the end of that corridor. It has no power."
"clinic.cutscene.sighting.1" = "She doesn’t have a face. She’s listening for me."
"clinic.cutscene.keypad.1" = "The cabinet clicks open."
"clinic.cutscene.power.1" = "The lights come back. She doesn’t."
"clinic.cutscene.exit.1" = "Cold air. Real air. I don’t look back."
"clinic.objective.leave" = "Leave through the north exit."
"clinic.objective.tripped" = "The breaker tripped. Shut off the corridor leak using the valve in the supply room."
"clinic.objective.power" = "Restore emergency power at the fuse box in the corridor."
"clinic.objective.valve" = "Shut off the pipe leak at the supply room valve before restoring power."
"clinic.objective.search" = "Search the supply room."
"clinic.objective.door" = "Open the supply room in the north corridor."
"clinic.objective.avoid" = "Avoid her. Find a key for the supply room."
"clinic.objective.start" = "The north exit has no power. Search the ward and reception."
