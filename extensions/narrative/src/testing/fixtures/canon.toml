[tone]
banned = [ "blood", "bloody", "bleeding", "gore", "gory", "guts", "corpse", "cadaver", "entrails", "severed", "mutilated", "rotting", "maggot", "maggots", "vomit", "kill", "killed", "killing", "murder", "suicide", "ghost", "haunted", "monster", "demon", "evil" ]
style = "Worn, not grimy; no gore. Dialogue is KRZ-style: plain, lyrical lines. Under it: Safdie-brothers momentum (people run on, repeat themselves and talk over their own sentences), Disco Elysium interiority (Ada’s own thoughts answer back, in the second person, sharp and wry), and Hereditary dread (grief in a family register, the wrong thing said kindly, horror only by implication). Ada: short, plain, first person, no exclamation marks. No exclamation marks from anyone. British spelling. Nobody in the game is evil, and no line says what anyone is."

