[people.ada]
name = "Ada Voss"
short = "A. Voss"
role = "Staff nurse, nights at St. Agnes since 1979. Wakes in Bed 04. The one who must choose (synthesis: the handover)."

[people.nurse]
name = "the Night Nurse"
short = "the Nurse"
role = "Thesis: the vigil. Ada's duty grown into a shape. Speaks three times in the game, in Ada's voice."

[people.porter]
name = "F. Lamb"
short = "the Porter"
role = "Counter-thesis: the release. The blind mortuary porter who signs the dead out at first light."

[people.dayNurse]
name = "the day nurse"
role = "The synthesis made flesh: the relief who comes in the morning. Appears only in the Handover ending."

[people.radio]
name = "the night programme"
short = "the radio"
role = "The world outside, still going. An unnamed presenter on the radio in the porter's office."

[people.patient]
name = "the patient in Bed 04"
role = "Never named. Asked for the lights to be left on."

[people.crew]
name = "the ambulance crew"
short = "the crew"
role = "Answered the 04:09 call and wrote the run sheet. One attendant is seen, with a stretcher trolley; the driver is only a voice on the radio. Comes to close the sheet. Never hostile, never harmed."

