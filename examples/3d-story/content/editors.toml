format = "af-editors/1"

# The hall opens in the 3D level editor (Levels 3D), Wick in Characters, and the walk speed in the Tuner. The game has no
# gates, so every row says `gates = []`.
[[file]]
glob = "content/levels/*.af-sector.json"
editor = "levels-3d"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/figures/*.toml"
editor = "studio"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]

# The hall's guard and its places, for Schematic. The game reads these three files; Save and Play shows the change.
[[file]]
glob = "content/systems/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]

[[file]]
glob = "content/nav/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]

[[file]]
glob = "content/puzzles/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]
