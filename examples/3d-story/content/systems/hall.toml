# The hall's guard: how it patrols, what it notices and when it gives chase. Open it in Schematic.
scene = "hall"
objects = []
matrix = []
rules = []
scenarios = []

[tunables]

[fairness]
cautiousWin = 0.9
firstThreatAfter = 20
telegraph = 1.5
maxDeathsPerRun = 1
safeWindowMargin = 1.3

[[agents]]
id = "guard"
modes = [ "patrol", "hunt", "search", "catch" ]
initial = "patrol"

[agents.speed]
patrol = 1.4
hunt = 2.2
search = 1.4
catch = 0

[[agents.senses]]
[agents.senses.sight]
range = 4

[[agents.senses]]
[agents.senses.touch]
radius = 0.6

[[agents.transitions]]
from = "patrol"
to = "hunt"
priority = 30
when = [ { sees = true } ]

[[agents.transitions]]
from = "hunt"
to = "hunt"
priority = 20
when = [ { sees = true } ]
do = [ { goTo = "player" } ]

[[agents.transitions]]
from = "hunt"
to = "search"
priority = 10
when = [ { not = { sees = true } } ]
do = [ { set = "self.timer", to = 0 } ]

[[agents.transitions]]
from = "search"
to = "hunt"
priority = 30
when = [ { sees = true } ]

[[agents.transitions]]
from = "search"
to = "patrol"
priority = 10
when = [ { fact = "self.idle", is = true }, { timer = 5 } ]

[[agents.transitions]]
from = "*"
to = "catch"
priority = 90
when = [ { touching = true } ]
do = [ { emit = { caught = "player" } } ]

[[agents.routine]]
node = "east"
dwell = 4

[[agents.routine]]
node = "door"
dwell = 1

[[agents.routine]]
node = "west"
dwell = 1
