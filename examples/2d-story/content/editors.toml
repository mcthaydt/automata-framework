format = "af-editors/1"

# What `automata editor` opens. The level is a level project the 2D editor edits; Save also writes the game's files
# into `exports` (project.toml, world.toml, levels/<id>.toml), which the game reads.
[[file]]
glob = "content/levels/*.af2d.json"
editor = "levels-2d"
modes = ["edit"]
exports = "content"
gates = []
checks = ["content"]

# The guard and where he may walk, for Schematic. The game reads these two files; Save and Play shows the change.
[[file]]
glob = "content/systems/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]

[[file]]
glob = "content/nav/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]

# Schematic's Fair play page: "Check now" plays the guard's scenarios through the story's own sim and reports, for each, how
# often it held. `fair-play/check.mjs` reads the guard's file as it stands on disk, which is where Schematic writes each change.
[[check]]
id = "fair-play"
run = ["node", "fair-play/check.mjs"]
when = "after"
joins = []
measure = true
