<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fake Ruken host (AF demos)</title>
    <style>
      html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; }
      iframe { display: block; }
      /* With a source frame (host.ts, source=): stacked on a tall page, side by side on a wide one. */
      body[data-view='source'] { display: grid; grid-template: 1fr 1fr / 1fr; overflow: hidden; }
      body[data-view='source'] iframe { min-height: 0; }
      @media (min-aspect-ratio: 1/1) {
        body[data-view='source'] { grid-template: 1fr / 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <iframe title="game"></iframe>
    <script type="module" src="./ruken/host.ts"></script>
  </body>
</html>
