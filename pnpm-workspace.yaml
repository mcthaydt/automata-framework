packages:
  - packages/*
  - tooling/*
  - games/*
  # The one-file examples (EX spec §5), one package per dimension, and the feature demos inside the 2D one
  # (examples/2d/content/hot-reload, examples/2d/ui/primitives).
  - examples/2d
  - examples/3d
  - examples/2d/*/*
# Same runtime as Ruken (docs/versions.md): pnpm runs scripts on this exact Node, whatever the system has.
useNodeVersion: 24.21.0
saveExact: true
engineStrict: true
onlyBuiltDependencies:
  - lefthook
