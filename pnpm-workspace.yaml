packages:
  - packages/*
  - starters/*
  - kits/*
  - examples
  - tooling/*
# Same runtime as the framework (its docs/versions.md): pnpm runs scripts on this exact Node.
useNodeVersion: 24.21.0
saveExact: true
engineStrict: true
# Core comes from packs of the framework at the commit in core.ref until core is on a registry (PRODUCT.5, P5-D1).
# `pnpm core:sync` owns everything between the two marker lines: it points each core package at its unpacked
# folder in .core/packs. Do not edit the block by hand; move core.ref and run the sync.
# core-overrides:begin
# Written by `pnpm core:sync` from .core/packs/packs.json (framework commit f1b38528eaa81a0ba7d163f06f9595e3d9349bd8).
overrides:
  '@mcthaydt/automata': file:.core/packs/automata
  '@mcthaydt/automata-check-boundaries': file:.core/packs/automata-check-boundaries
  '@mcthaydt/automata-content': file:.core/packs/automata-content
  '@mcthaydt/automata-game': file:.core/packs/automata-game
  '@mcthaydt/automata-host': file:.core/packs/automata-host
  '@mcthaydt/automata-node': file:.core/packs/automata-node
  '@mcthaydt/automata-render-pixi': file:.core/packs/automata-render-pixi
  '@mcthaydt/automata-runtime': file:.core/packs/automata-runtime
  '@mcthaydt/automata-sector-format': file:.core/packs/automata-sector-format
  '@mcthaydt/automata-ship': file:.core/packs/automata-ship
  '@mcthaydt/automata-sim': file:.core/packs/automata-sim
  '@mcthaydt/automata-testing': file:.core/packs/automata-testing
  '@mcthaydt/automata-ui': file:.core/packs/automata-ui
  '@mcthaydt/evidence': file:.core/packs/evidence
# core-overrides:end
