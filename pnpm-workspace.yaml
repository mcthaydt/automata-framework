packages:
  - packages/*
  - extensions/*
  - tooling/*
  - games/*
  # The one-file examples, one package per dimension, and the feature demos inside the 2D one
  # (examples/2d/content/hot-reload, examples/2d/ui/primitives) and the 3D wardrobe extension (examples/3d/wardrobe).
  - examples/2d
  - examples/3d
  - examples/3d/wardrobe
  - examples/2d/*/*
  # The website (automata.dev), moved in with its history on 2026-11-06.
  - site
# Same runtime as Ruken (docs/versions.md): pnpm runs scripts on this exact Node, whatever the system has.
useNodeVersion: 24.21.0
saveExact: true
engineStrict: true
onlyBuiltDependencies:
  - lefthook
