# `ward-plaster`: the clinic's walls, a sea-green plaster. The old game painted it as an even sea-green (#47655a) with sparse lighter
# (#5b7b69) and darker (#394d3c) clusters and a few hairline cracks, and its walls read green in every frame; the first draft here took
# the colour from the mean of a different file and was a khaki sand. Both greens are DUEL colours: the base is sage step 1, the lighter
# cluster sage step 2. The kit's plaster photograph and stain wear make the clusters and cracks. The old game multiplied the plaster's linear
# colour by its light; the framework's `srgb` light multiplies the sRGB colour, so the lamps carry a gain (`content/look.toml`).
ramp = "sage"
step = 1
accent = "stainBrown"

[texture]
photo = "plaster"
contrast = 0.01
range = [-1, 1]
cluster = 10
wear = 0.15
seed = 1
