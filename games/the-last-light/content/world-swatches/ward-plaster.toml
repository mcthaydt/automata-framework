# `ward-plaster`: the clinic's walls. They stand for the old game's `plaster` (public/art/plaster.png at 92e6704, a mean colour of
# #858667, a khaki grey). The kit's `plasterPaint` is a mint green (#8ac196, a luma of 170 against 131) and its `plasterWarm` a pale sand;
# the palette has no olive. The old game multiplied the plaster's linear colour by its light; the framework's `srgb` light multiplies the sRGB
# colour, so the step that draws as the old plaster did is the darkest sand, #625d54 (DUEL ramp sand, step 0), not step 1 (#857565), the nearest
# to the old file's colour in RGB (measured on the real play: the east wall's luma 54 with step 0, 68 with step 1, the old's 42). The gap is
# the colour's: an olive-khaki is not a step of any DUEL ramp. The kit's plaster photograph and wear are kept.
ramp = "sand"
step = 0
accent = "stainBrown"

[texture]
photo = "plaster"
contrast = 0.005
cluster = 10
wear = 0.15
seed = 1
