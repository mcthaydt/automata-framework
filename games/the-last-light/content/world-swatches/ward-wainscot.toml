# `ward-wainscot`: the clinic's glazed tile, the lower band of its walls. It stands for the old game's `wainscot` (the canvas texture in
# `src/render/assets.ts` at 92e6704: cream tiles, base `#ccc3b1`, a glazed top edge `#eadbc9`, a shaded foot `#aea189`, grout `#625d54`).
# That base is a DUEL colour, sand step 5, so there is no gap to the palette here; it reads teal in the old game's frames because of the
# green the old room's light and grade lay over it. The kit's floor-tile photograph (Floor Tiles 08, CC0: square ceramic tiles on a dark joint) is read at 15 cm a tile, the old tile's size, so the grid shows
# at the play camera; the wall-tile photograph it replaced had no joint a texel wide.
ramp = "sand"
step = 5
accent = "groutLight"
reads = { at = 64 }

[texture]
photo = "floorTiles"
scale = 0.5
contrast = 0.04
facet = 0
flatten = 1
range = [-4, 1]
cluster = 5
wear = 0
seed = 73
