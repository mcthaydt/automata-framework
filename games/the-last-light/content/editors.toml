format = "af-editors/1"

# Every kind of content the game has opens in the editor that edits it. The game has no gates, so each row says
# `gates = []`. Rows are added as the content arrives (the level, the lines, the cutscenes, the systems, the sound).
[[file]]
glob = "content/levels/*.af-sector.json"
editor = "levels-3d"
modes = ["edit"]
gates = []
checks = ["content"]

# Ada's lines and the register's, in Writer; the cutscenes in Sequence.
[[file]]
glob = "content/lines/*.toml"
editor = "writer"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/cutscenes/*.toml"
editor = "sequence"
modes = ["edit"]
gates = []
checks = ["content"]

# The creature, the walking graph and the puzzle, in Schematic. The game loads these files as they are, so a Save is a
# change in play.
[[file]]
glob = "content/systems/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/nav/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/puzzles/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

# The tuning numbers, the sound and what the player feels. The audio file's footsteps table is a gap (the Audio editor opens the
# file and keeps the table, with no rows for it): editor gaps ledger row 9.
[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/audio/*.toml"
editor = "audio"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/feel/*.toml"
editor = "feel"
modes = ["edit"]
gates = []
checks = ["content"]
