# The prologue's cutscenes. They were converted once from the game's prologue at 92e6704 (through October's fixture),
# and this file is now the source: edit it by hand and in Sequence.
id = "opening"
duration = 17

# The hall, over her shoulder toward the desk, the title over it. It stood 5 m from her, high, at 22 to 25 mm, which draws her a texel
# under one field pixel (painted at one: she stood 5 to 7% off the room); a lens that makes her two from there crops her into the corner,
# so the camera comes down and in behind her (3 m) and looks past her at the desk: she stands whole in the lower half, the hall beyond.
[[camera]]
t = 0
pos = [ -0.5, 2.1, 5.9 ]
look = [ 0.9, 0.55, 1.6 ]
lens = 27.9

[[camera]]
t = 4.6
pos = [ -0.5, 2.1, 5.9 ]
look = [ 0.9, 0.55, 1.6 ]
lens = 28.8
ease = "linear"

# Ada speaks: a head-and-shoulders close-up (the Owner, 2026-11-12: the camera may change to keep her looking good). It stands 1.3 m from
# her face. The figure is painted at density 2 in a cutscene as in play (`PLAY_FIGURE`, pinned: no shot picks a density) and placed at a whole
# number of field pixels a texel, so the lens is set to make that number 4 (28.5 to 29.4 mm: her head large and crisp, a 3% creep); at the
# old 26 to 28 mm it was 3.6 to 3.9, drawn at 4, and she was drawn up to 11% larger than the room around her.
[[camera]]
t = 4.6
pos = [ 0.9, 1.61, 2.35 ]
look = [ 0.6, 1.36, 3.6 ]
cut = true
lens = 28.5

[[camera]]
t = 11
pos = [ 0.9, 1.61, 2.35 ]
look = [ 0.6, 1.36, 3.6 ]
lens = 29.4
ease = "linear"

[[camera]]
t = 11
pos = [ 2.05, 1.95, 1.6 ]
look = [ 3.3, 1.85, -0.86 ]
cut = true
lens = 32

[[camera]]
t = 13
pos = [ 2.05, 1.95, 1.6 ]
look = [ 3.3, 1.85, -0.86 ]
lens = 35
ease = "linear"

[[camera]]
t = 13
pos = [ 2, 1.9, 0.1 ]
look = [ 0.6, 1.2, 3.6 ]
cut = true
lens = 36.9

[[camera]]
t = 15.9
pos = [ 2, 1.9, 0.1 ]
look = [ 0.6, 1.2, 3.6 ]
lens = 38.0
ease = "linear"

# Into play: a crane down onto the play camera at the spawn (the hall's view: 79 mm, 8 m back from a look 1.0 m over her feet, tilted
# 25 degrees, from the south), from 35 degrees, 8 m out. The old shot zoomed from 40 to 50 mm onto the old play camera, 16 m back, and
# drew her under a field pixel a texel, which the painter rounds up to one: she stood 70% too tall for the room. Now she is two all the way.
[[camera]]
t = 15.9
pos = [ 0.6, 5.5886, 10.1532 ]
look = [ 0.6, 1, 3.6 ]
cut = true
lens = 79

[[camera]]
t = 17
pos = [ 0.6, 4.3809, 10.8505 ]
look = [ 0.6, 1, 3.6 ]
lens = 79
ease = [ 0.3333333333333333, 0.6666666666666666, 0.6666666666666666, 1 ]

