# The picture's two passes: the old game's retro grade and LCD panel. Their numbers are the old game's, which are the defaults, so
# there is nothing to set under [retro]; add a key under it or [lcd] to change one (the extensions' READMEs list them; a setting out of
# range is refused when the game builds). No editor opens this file yet (the editor gaps ledger, row 18).
[retro]

# The old game drew its LCD panel on the screen's own pixels: a cell of 2 screen pixels, a mesh of 4. Ours is drawn on the field, which
# the window shows at a whole scale (2x at 1024 by 768), so the same 2-pixel cell is one field pixel. A 4-pixel mesh would be 2 field
# pixels, the Nyquist limit, where the pass fades the mesh out; 3 field pixels (6 on the screen) is the finest it can draw.
[lcd]
cell = 1

# The old game multiplied a texel's linear colour by its light and showed the product as it was; the framework's `srgb` light multiplies the
# sRGB colour, so the old game's lamp numbers draw about twice as bright (a mid grey is 0.5 in sRGB and 0.21 in linear light). `lamps` is a gain on
# every lamp's strength; the ambient and fill are the old game's. Measured on the real play at 1024 by 768 (the session 8 audit folder).
[light]
lamps = 0.7
