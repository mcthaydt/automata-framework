[[lines]]
id = "prologue.cutscene.rest.1"
kind = "caption"
speaker = "ada"
text = "prologue.cutscene.rest.1"
motifs = [ "line" ]
words = "All quiet. I will write that in the register. First night. All quiet."

[[lines.delivery.beats]]
after = 1
pause = 1

[[lines.delivery.beats]]
after = 2
pause = 1

[[lines.delivery.beats]]
after = 3
