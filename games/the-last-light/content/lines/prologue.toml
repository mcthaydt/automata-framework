text = "prologue.register.makeBed"
motifs = [ "handwriting" ]
words = "Bed 04, to be made up"

[[lines]]
id = "prologue.register.vigil"
kind = "note"
text = "prologue.register.vigil"
motifs = [ "handwriting" ]
words = "Her round"

[[lines]]
id = "prologue.cutscene.opening.1"
