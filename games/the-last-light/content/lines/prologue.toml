motifs = [ "clocks" ]
words = "St. Agnes Clinic. 20:00."

[[lines]]
id = "prologue.cutscene.opening.2"
kind = "caption"
speaker = "ada"
text = "prologue.cutscene.opening.2"
words = "First night. The day shift went out the door like the building was on fire. It isn’t. I checked."

[[lines.delivery.beats]]
after = 2
pause = 1

[[lines.delivery.beats]]
after = 3
pause = 1

[[lines]]
id = "prologue.cutscene.opening.3"
kind = "caption"
speaker = "ada"
text = "prologue.cutscene.opening.3"
motifs = [ "handwriting" ]
words = "She left me a note. A long one."

[[lines.delivery.beats]]
after = 1
pause = 1

[[lines]]
id = "prologue.cutscene.keypad.1"
kind = "caption"
text = "prologue.cutscene.keypad.1"
words = "The cabinet clicks open."

[[lines]]
id = "prologue.cutscene.lightsOut.1"
kind = "caption"
speaker = "ada"
text = "prologue.cutscene.lightsOut.1"
motifs = [ "warmth" ]
words = "Every lamp goes out at once. Like a held breath. Mine is the last one."

[lines.delivery]
pace = 0.85

[[lines.delivery.beats]]
