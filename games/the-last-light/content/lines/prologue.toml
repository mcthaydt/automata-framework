speaker = "ada"
text = "prologue.item.supplyKey"
motifs = [ "tags" ]
words = "Paper tag: SUPPLY."

[[lines]]
id = "prologue.item.sheets.name"
kind = "item"
text = "prologue.item.sheets.name"
words = "Clean sheets"

[[lines]]
id = "prologue.item.sheets"
kind = "item"
speaker = "ada"
text = "prologue.item.sheets"
motifs = [ "four" ]
words = "Folded square, for Bed 04. Use them on the bed."

[[lines]]
id = "prologue.registerAsk"
kind = "note"
text = "prologue.registerAsk"
motifs = [ "line" ]
words = "A clean page. SIGNED ON, HANDED OVER TO."

[[lines]]
id = "prologue.registerSign"
kind = "dialogue"
speaker = "ada"
text = "prologue.registerSign"
words = "Sign on."

[[lines]]
id = "prologue.registerLeave"
kind = "dialogue"
speaker = "ada"
text = "prologue.registerLeave"
words = "Not now."

[[lines]]
id = "prologue.registerSigned"
kind = "file"
text = "prologue.registerSigned"
motifs = [ "handwriting", "line" ]
words = "NIGHT REGISTER\nSIGNED ON 20:00   A. Voss   First night. All quiet.\nHANDED OVER TO:"

[[lines]]
id = "prologue.st.p0.blanket"
kind = "examine"
speaker = "ada"
text = "prologue.st.p0.blanket"
motifs = [ "warmth", "pools", "four" ]
words = "Under the ward lamp I smooth the ticking flat with both hands, the way you would for somebody already lying there. Square corners, with no sheet to square. The dip stays where it is."

[lines.delivery]
pace = 0.85

[[lines.delivery.beats]]
after = 2
pause = 1

[[lines]]
id = "prologue.st.p0.jug"
kind = "examine"
speaker = "ada"
text = "prologue.st.p0.jug"
motifs = [ "four" ]
words = "I wipe the nightstand down with my sleeve, so whoever wakes in 04 tomorrow wakes to something clean. You make a place ready before anybody asks you to."

[[lines.delivery.beats]]
after = 1
pause = 1

[[lines]]
id = "prologue.st.p0.window"
kind = "examine"
speaker = "ada"
text = "prologue.st.p0.window"
motifs = [ "clocks" ]
words = "Frost on the high window, at the corners first, the way it starts. Past the bars the county is dark to the edge of it. Eight o’clock, and the whole night still in front of me."

[[lines]]
id = "prologue.register.code"
kind = "note"
text = "prologue.register.code"
motifs = [ "handwriting" ]
words = "The cabinet’s four numbers"

[[lines]]
id = "prologue.register.supplyKey"
kind = "note"
text = "prologue.register.supplyKey"
motifs = [ "handwriting" ]
words = "The key from the cabinet"

[[lines]]
