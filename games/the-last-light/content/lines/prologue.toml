[[lines]]
id = "prologue.cutscene.rest.2"
kind = "caption"
speaker = "ada"
text = "prologue.cutscene.rest.2"
words = "Just close my eyes. Just until it is light. Somewhere in the walls, a click, like a tongue."

[lines.delivery]
