[[lines]]
id = "prologue.objective.note"
kind = "objective"
text = "prologue.objective.note"
words = "Read the note the day shift left on the desk."

[[lines]]
id = "prologue.objective.key"
kind = "objective"
text = "prologue.objective.key"
words = "Get the supply key from the cabinet. The code is in the note."

[[lines]]
id = "prologue.objective.lamp"
kind = "objective"
text = "prologue.objective.lamp"
words = "Find the hand lamp in the ward."

[[lines]]
id = "prologue.objective.fill"
kind = "objective"
text = "prologue.objective.fill"
words = "Fill the lamp: select it, choose combine, then the paraffin."

[[lines]]
id = "prologue.objective.closet"
kind = "objective"
text = "prologue.objective.closet"
words = "Take the lit lamp to the supply room in the corridor. F snuffs it and lights it again."

[[lines]]
id = "prologue.objective.sheets"
kind = "objective"
text = "prologue.objective.sheets"
words = "Take clean sheets from the supply room."

[[lines]]
id = "prologue.objective.bed"
kind = "objective"
text = "prologue.objective.bed"
words = "Make up Bed 04: select the sheets, then use them on the bed."

[[lines]]
id = "prologue.objective.hide"
kind = "objective"
text = "prologue.objective.hide"
words = "Keep the lamp lit, or hide behind the privacy screen or in the supply locker, until she goes."

[[lines]]
id = "prologue.objective.rest"
kind = "objective"
text = "prologue.objective.rest"
words = "She has gone. Sit down at Bed 04."

