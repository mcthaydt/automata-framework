[[lines]]
id = "prologue.cutscene.lightsOut.2"
kind = "caption"
speaker = "ada"
text = "prologue.cutscene.lightsOut.2"
words = "Somebody at the end of the corridor. Nobody came in. I would have heard."

[lines.delivery]
pace = 0.85

[[lines.delivery.beats]]
after = 1
pause = 1

[[lines.delivery.beats]]
after = 2
pause = 1

[[lines]]
id = "prologue.cutscene.found.1"
kind = "caption"
speaker = "ada"
text = "prologue.cutscene.found.1"
motifs = [ "four" ]
words = "Cold fingers on my wrist, counting my pulse. Gently. I blink. Bed 04 again, in the dark."

[lines.delivery]
pace = 0.85

[[lines.delivery.beats]]
after = 1
pause = 1

[[lines.delivery.beats]]
after = 2
pause = 1

[[lines.delivery.beats]]
