format = "af-editors/1"

# Ember Hall's room is a 3D level, edited in Levels 3D; Wick is a figure, edited in Characters (the Studio); and the
# walk and the roll open in the Tuner (content/tuning.toml). The game has no gates: every row says so with `gates = []`.
[[file]]
glob = "content/levels/*.af-sector.json"
editor = "levels-3d"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/figures/*.toml"
editor = "studio"
modes = ["edit"]
gates = []
checks = ["content"]

# Wick is drawn from the swatches, gait, poses and the rest beside him; Characters reads them too, or its stage has nothing to draw him from.
[[file]]
glob = "content/figure-*/*.toml"
editor = "studio"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]
