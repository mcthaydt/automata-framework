# The lock-on target of base-3d's first slice (M3 spec §4.7): an old lamplighter standing in the kiln. Copied from
# figures' fixture keeper (packages/figures/src/testing/fixtures/content/figures/keeper.toml at 077484c7): tall,
# hunched, the elderly gait, a coat and a flat cap, cropped grey hair.

skin = "pale"
gait = "elderly"
hand = "L"
default = "lamplighter"
stand = "hand-in-jacket-pocket"

[sliders]
height = 186
frame = 0.2
legs = 0.75
arms = 0.85
shoulders = 0.6
head = 0.4
neckLength = 0.6
