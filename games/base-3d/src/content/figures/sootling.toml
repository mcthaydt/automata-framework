# A placeholder until GAME-3D.1j authors it in the Studio (GAME-3D.1d part 4): the target figure (figures/target.toml)
# with its sliders and coat changed. A Sootling (DESIGN.md §8.2), at the slider's 120 cm floor; its view scales it to 0.9 m.

skin = "pale"
gait = "bounce"
hand = "L"
default = "lamplighter"
stand = "hand-in-jacket-pocket"

[sliders]
height = 120
frame = 0.2
legs = 0.75
arms = 0.85
shoulders = 0.6
head = 0.4
neckLength = 0.6
posture = 0.2
age = 0.1
hunch = 0.8
chunk = 0.2
muscle = 0.2
fat = 0.2

[sliders.face]
jaw = 0.7
chin = 0.65
bridge = 0.8
browWeight = 0.8
hood = 0.6

[hair]
stiff = 70
trail = 0.15

