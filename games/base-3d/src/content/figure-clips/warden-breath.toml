# The enemy move `warden-breath`'s clip (DESIGN.md §8.2 to §8.4, GAME-3D.1d part 4): 90 frames, `contact` on frame 49
# (tick 48: 0.8 s), so it lines up with the sim's first active frame (G3-d's check, content.test.ts). A
# placeholder until GAME-3D.1j authors it in the Studio: the arm drawn back through the windup, then driven forward.

length = 1.5
loop = "once"
mask = [ "armR", "torso" ]

[markers]
windup = 0.48
contact = 0.8

[[keys]]
t = 0
pose = "guard-high"

[[keys]]
t = 0.48
ease = "out"

[keys.pose.effectors.handR]
pos = [ -0.1, 1.6, -0.25 ]

[keys.pose.effectors.chest]
rot = [ -10, -15, 0 ]

[[keys]]
t = 0.8
ease = "in"

[keys.pose.effectors.handR]
pos = [ 0, 1, 0.6 ]

[keys.pose.effectors.chest]
rot = [ 15, 5, 0 ]

[[keys]]
t = 1.5
pose = "guard-high"
ease = "inOut"
