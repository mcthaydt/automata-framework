# Wick's roll (DESIGN.md §7.2 `roll`, EDITOR-GAPS EG-6): a tucked forward roll through its 3.2 m, as long as the move's
# 24 ticks (0.4 s at 60 Hz; the view retimes it to the roll either way). He drops into the tuck by `tuck`, holds it
# low through the lunge and rises from `rise`. It has no hit, so no `contact`.

length = 0.4
loop = "once"
mask = [ "pelvis", "torso", "head", "armL", "armR" ]

[markers]
tuck = 0.08
rise = 0.3

[[keys]]
t = 0
pose = "stand"

[[keys]]
t = 0.08
pose = "roll-tuck"
ease = "out"

[[keys]]
t = 0.3
pose = "roll-tuck"

[[keys]]
t = 0.4
pose = "stand"
ease = "inOut"
