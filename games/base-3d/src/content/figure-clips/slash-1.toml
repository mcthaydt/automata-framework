# Wick's first slash (DESIGN.md §7.2 `slash-1`, GAME-3D.1c part 3): right to left, the `slash` clip's arc, as long as
# the move's 22 frames, with `contact` on its first active frame (frame 6, tick 5: 5 / 60 s). A placeholder until
# GAME-3D.1j authors the moves' clips in the Studio; content.test.ts holds it to the move (G3-d).

length = 0.3667
loop = "once"
mask = [ "armR", "torso" ]

[markers]
windup = 0.04
contact = 0.0833

[[keys]]
t = 0
pose = "guard-high"

[[keys]]
t = 0.04
ease = "out"

[keys.pose.effectors.handR]
pos = [ -0.3, 1.5, 0.05 ]

[keys.pose.effectors.chest]
rot = [ 0, -20, 0 ]

[[keys]]
t = 0.0833
ease = "in"

[keys.pose.effectors.handR]
pos = [ 0.15, 0.95, 0.45 ]

[keys.pose.effectors.chest]
rot = [ 5, 25, 0 ]

[[keys]]
t = 0.3667
pose = "guard-high"
ease = "inOut"
