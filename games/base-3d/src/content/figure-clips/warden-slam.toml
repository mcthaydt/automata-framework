# The enemy move `warden-slam`'s clip (DESIGN.md §8.2 to §8.4, GAME-3D.1d part 4): 70 frames, `contact` on frame 41
# (tick 40: 0.6667 s), so it lines up with the sim's first active frame (G3-d's check, content.test.ts). A
# placeholder until GAME-3D.1j authors it in the Studio: the arm drawn back through the windup, then driven forward.

length = 1.1667
loop = "once"
mask = [ "armR", "torso" ]

[markers]
windup = 0.4
contact = 0.6667

[[keys]]
t = 0
pose = "guard-high"

[[keys]]
t = 0.4
ease = "out"

[keys.pose.effectors.handR]
pos = [ -0.1, 1.6, -0.25 ]

[keys.pose.effectors.chest]
rot = [ -10, -15, 0 ]

[[keys]]
t = 0.6667
ease = "in"

[keys.pose.effectors.handR]
pos = [ 0, 1, 0.6 ]

[keys.pose.effectors.chest]
rot = [ 15, 5, 0 ]

[[keys]]
t = 1.1667
pose = "guard-high"
ease = "inOut"
