# Wick's second slash (DESIGN.md §7.2 `slash-2`, GAME-3D.1c part 3): left to right, back across the first, 24 frames,
# `contact` on frame 7 (tick 6: 0.1 s). It blends in over 50 ms so the chain reads snappy (§7.7). A placeholder until
# GAME-3D.1j.

length = 0.4
loop = "once"
mask = [ "armR", "torso" ]

[blend]
inMs = 50
outMs = 80

[markers]
windup = 0.05
contact = 0.1

[[keys]]
t = 0
pose = "guard-high"

[[keys]]
t = 0.05
ease = "out"

[keys.pose.effectors.handR]
pos = [ 0.2, 1.05, 0.2 ]

[keys.pose.effectors.chest]
rot = [ 0, 25, 0 ]

[[keys]]
t = 0.1
ease = "in"

[keys.pose.effectors.handR]
pos = [ -0.3, 1.3, 0.45 ]

[keys.pose.effectors.chest]
rot = [ 0, -25, 0 ]

[[keys]]
t = 0.4
pose = "guard-high"
ease = "inOut"
