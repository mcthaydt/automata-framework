# Wick's hop-back (DESIGN.md §7.2 `hop-back`, GAME-3D.1c part 3): a hop back, a quick crouch and spring, as long as the move's 20 frames. It has no hit,
# so no `contact`. A placeholder (the pickup's crouch) until GAME-3D.1j authors it in the Studio.

length = 0.3333
loop = "once"
mask = [ "pelvis", "torso", "head", "armR" ]

[[keys]]
t = 0
pose = "stand"

[[keys]]
t = 0.08
pose = "pickup-low"
ease = "out"

[[keys]]
t = 0.2
pose = "pickup-low"

[[keys]]
t = 0.3333
pose = "stand"
ease = "inOut"
