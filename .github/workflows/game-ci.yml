name: game-ci

# Builds a game of this repository the way it ships and checks the build for Ruken (`automata ship prepare`, which
# runs Ruken's own manifest parser). ci.yml calls it for Emberwick and 3d.yml for base-3d; the `checks` job of ci.yml
# already runs each game's check, tests and determinism rules, so this job only builds and prepares.
#
# A game made with `automata create-game` does not call this: it has its own `.github/workflows/release.yml`.

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label for the job.
        type: string
        required: true
      working-directory:
        description: The game's folder in this repository.
        type: string
        required: true
      build-command:
        description: How the game builds its dist/.
        type: string
        default: pnpm build
      artifact-name:
        description: The name the built dist/ is uploaded under. Each caller in one run needs its own.
        type: string
        required: true

permissions:
  contents: read

jobs:
  game:
    name: build, prepare
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      BUILD_COMMAND: ${{ inputs.build-command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder.
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: $BUILD_COMMAND
      - name: Prepare for Ruken
        working-directory: ${{ inputs.working-directory }}
        run: pnpm exec automata ship prepare --target ruken
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 7
