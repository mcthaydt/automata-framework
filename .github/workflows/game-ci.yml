name: game-ci

# The reusable CI for a game built on AF (ship spec §3.7). A game's own .github/workflows/ci.yml is:
#
#   on: [push, pull_request]
#   jobs:
#     ci:
#       uses: mcthaydt/automata-framework/.github/workflows/game-ci.yml@main
#       with:
#         sim-roots: src/sim
#
# It installs and checks the game, runs AF's determinism checker on the game's sim-plugin sources (M1 shared
# contracts §2), builds, and prepares the build for Ruken with `automata ship prepare` (ruken.toml checked by
# Ruken's parser). The AF tools are the game's own dev dependency (@mcthaydt/automata-tools from GitHub
# Packages, M2.4 spec §3.7; its `automata-check-boundaries` bin is the determinism checker), so the game's
# package.json picks the AF version; this workflow never checks AF out.
#
# A game in another repository needs, since AF is private: AF's Settings → Actions → General → Access set to
# "Accessible from repositories owned by mcthaydt", and the secret AF_READ_TOKEN, a classic personal access
# token with read:packages (GitHub Packages' npm registry accepts no other kind). AF's own examples need neither.

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label for the job. GitHub's own by default; AF passes its self-hosted af-linux.
        type: string
        default: ubuntu-latest
      working-directory:
        description: The game's folder in its repository.
        type: string
        default: "."
      sim-roots:
        description: Space-separated folders of the game's sim plugins, checked by check-boundaries. Empty skips the check.
        type: string
        default: ""
      allow-imports:
        description: Space-separated extra imports the determinism checker allows in sim sources (each passed as --allow-import; needs the checker from M2.1b). Empty adds none.
        type: string
        default: ""
      build-command:
        description: How the game builds its dist/.
        type: string
        default: pnpm build
      artifact-name:
        description: The name the built dist/ is uploaded under. Each caller in one run needs its own.
        type: string
        default: game-dist

    secrets:
      AF_READ_TOKEN:
        description: A classic personal access token with read:packages, to install AF's packages from GitHub Packages (its npm registry accepts no other kind). Not needed inside AF.
        required: false

permissions:
  contents: read

jobs:
  game:
    name: check, determinism, build, prepare
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      WORKDIR: ${{ inputs.working-directory }}
      SIM_ROOTS: ${{ inputs.sim-roots }}
      BUILD_COMMAND: ${{ inputs.build-command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A game installs AF's packages from GitHub Packages, so without the token nothing else can work.
      - name: AF_READ_TOKEN is set
        if: github.repository != 'mcthaydt/automata-framework'
        env:
          AF_READ_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if [[ -z "$AF_READ_TOKEN" ]]; then echo "::error::AF_READ_TOKEN (a classic personal access token with read:packages) is missing"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      # registry-url and scope write an .npmrc that sends NODE_AUTH_TOKEN to GitHub Packages for @mcthaydt.
      # Inside AF every @mcthaydt package is a workspace link and the token is not needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@mcthaydt"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::error::pnpm install failed. If GitHub Packages answered 401 or 403: AF_READ_TOKEN must be a classic personal access token with read:packages (GitHub Packages' npm registry accepts no other kind)."
            exit 1
          fi
      - name: Check
        # Inside AF, the `checks` job runs every example's check (typecheck + test:unit + check-boundaries), so
        # an example's own job does not repeat it. A game repository runs its own check here.
        if: github.repository != 'mcthaydt/automata-framework'
        run: pnpm --dir "$WORKDIR" run --if-present check
      - name: Determinism checker on the sim sources
        # Inside AF the root `boundaries` script already checks the examples' sim sources; a game runs it here.
        if: inputs.sim-roots != '' && github.repository != 'mcthaydt/automata-framework'
        working-directory: ${{ inputs.working-directory }}
        env:
          ALLOW_IMPORTS: ${{ inputs.allow-imports }}
        run: |
          allow=()
          for name in $ALLOW_IMPORTS; do allow+=(--allow-import "$name"); done
          # SIM_ROOTS is split on whitespace on purpose: one argument per folder.
          # shellcheck disable=SC2086
          pnpm exec automata-check-boundaries $SIM_ROOTS "${allow[@]}"
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: $BUILD_COMMAND
      - name: Prepare for Ruken
        working-directory: ${{ inputs.working-directory }}
        run: pnpm exec automata ship prepare --target ruken
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 7
