name: ci

# AF's own CI (ship spec §3.7). Checks run on every push and pull request; cross-engine parity runs on every push
# to main and on pull requests that are not drafts (a draft runs it in a cloud container, docs/cloud-parity.md).
# Browser journeys run only nightly and on request (`automata-ship test-remote <spec>`).
#
# Runners (D-5, reuse the Owner's runners): hosted jobs get no runner on this account (2026-10-11; they fail in
# about 2 s with runner_id 0), so every job runs on a self-hosted runner registered to this repository with the
# label af-linux (WSL2 Ubuntu with Docker, like Ruken's ruken-linux; ship spec §3.7). There is deliberately no
# fallback to ubuntu-latest: with no runner online a job waits in the queue instead of failing at once. The
# repository variable AF_LINUX_RUNNER switches every job to another label (ubuntu-latest once hosted minutes
# are back), and AF_GPU_RUNNER moves the browser journeys alone. Until a runner serves AF, a full local run is
# the green gate (docs/04-how-we-build.md).

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft skips parity (below), so it runs when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      spec:
        description: Playwright arguments for one focused browser run (test-remote), e.g. "games/placeholder/e2e/boot.e2e.ts --project=placeholder". Empty runs the checks.
        type: string
        default: ""
      nightly:
        description: Run the nightly set now.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, boundaries, style, unit
    if: github.event_name != 'workflow_dispatch' || inputs.spec == ''
    runs-on: ${{ vars.AF_LINUX_RUNNER || 'af-linux' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so `changeset status` on a pull request can find where it left origin/main. Not an
          # expression: `cond && 0 || 1` always gives 1, because 0 is falsy in Actions expressions.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm style
      # QB.1 (QB spec §4.1): unused files, exports and dependencies (knip.jsonc).
      - run: pnpm knip
      - run: pnpm test:unit
      # QB.1: each of these first proves it fails on its planted fixture, then checks the repository. The audit is
      # `pnpm audit --prod --audit-level=high`; the secret scan runs the pinned gitleaks over the full history
      # (fetch-depth 0 above).
      - run: pnpm audit:deps
      - run: pnpm secrets
      # QB.1: every package this pull request adds that main never used, with its registry, publisher and weekly
      # downloads, in the job summary. Fails when a package or version is not on its registry.
      - run: pnpm deps:new --base origin/main
        if: github.event_name == 'pull_request'
      # Every one-file example builds through the runner (EX spec §5); their smoke runs with the journeys.
      - run: pnpm build:examples
      # Every old feature demo builds (examples/README.md) until EX.4 ports and deletes them.
      - run: pnpm build:demos
      # S8 budgets E1 and E3 (docs/spikes/s8-effect.md): Effect's share and the page's gzip size.
      - run: pnpm --filter @af-examples/placeholder budget:size
      # Releases (M2.4 spec §3.5): a pull request that changes a published package carries a changeset, every
      # changeset is a patch before 1.0, and every published package builds with nothing of Ruken's imported.
      - run: pnpm changeset status --since=origin/main
        if: github.event_name == 'pull_request'
      - run: node tooling/release/src/check-changesets.ts
      # PRODUCT.1 (PRODUCT spec §2 F6): each core package's API report matches its source, and every API break
      # against origin/main's reports is declared by a changeset.
      - run: pnpm api-report
      - run: pnpm build
      - run: pnpm --filter @mcthaydt/release test:dist
      # DX.4: the API index and llms-full.txt from the built .d.ts; fails on a new export with no doc comment.
      - run: pnpm api-index

  parity:
    name: parity (chromium, webkit, firefox)
    # af-linux is one shared PC runner, so a draft PR runs parity in a cloud container instead
    # (docs/cloud-parity.md). Pushes to main have no pull_request and always run it.
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.spec == '') &&
      github.event.pull_request.draft != true
    runs-on: ${{ vars.AF_LINUX_RUNNER || 'af-linux' }}
    timeout-minutes: 10
    # Browsers and their OS deps come preinstalled and pinned; installing them per run blew the 10-minute budget.
    # Keep the tag in step with the `playwright` devDependency (docs/versions.md, Container images).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # The container runs as root but the checkout belongs to the runner user; without this, git (and so the
      # `prepare` hook install) refuses the repo as "dubious ownership".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: pnpm install --frozen-lockfile
      # Every package with a browsers vitest project (sim, content, physics, ui, ...) runs its parity suite.
      - run: pnpm test:parity
        env:
          HOME: /root # Actions sets HOME to /github/home (not root's); Firefox refuses to run as root there
      # The container runs as root in the runner's shared work folder (/__w is _work, /__t the tool cache). Hand
      # everything back to the runner user, the owner of /__w, or the next job's checkout cannot delete the
      # root-owned node_modules ("Permission denied"). always() runs on failure and on cancel too.
      - name: Give the work folder back to the runner user
        if: always()
        run: for dir in /__w /__t; do [ ! -d "$dir" ] || chown -R "$(stat -c %u:%g /__w)" "$dir"; done

  e2e:
    name: browser journeys (nightly and on request)
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.spec != '' || inputs.nightly))
    runs-on: ${{ vars.AF_GPU_RUNNER || vars.AF_LINUX_RUNNER || 'af-linux' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: runner.environment == 'github-hosted'
      # A self-hosted runner has the system libraries installed once and no sudo; the browser itself is fetched
      # into its cache here (a no-op when it is already there).
      - run: pnpm exec playwright install chromium
        if: runner.environment == 'self-hosted'
      - name: Browser journeys
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          # SPEC is split on whitespace on purpose (test-remote passes Playwright arguments through). No `--`:
          # after one Playwright stops filtering. A SPEC that matches nothing fails ("No tests found").
          # shellcheck disable=SC2086
          pnpm test:e2e $SPEC
      # S8 budgets E2, E4 and E5 (boot at 4x CPU under Ruken's CSP) on the nightly run, not on a focused one.
      - name: S8 boot budgets
        if: inputs.spec == ''
        run: pnpm --filter @af-examples/placeholder budget:boot
      # The packed packages installed outside the workspace (M2.4 spec §3.6), nightly; pull requests that touch
      # build config run it in consumer-smoke.yml.
      - run: pnpm build
        if: inputs.spec == ''
      - run: node tooling/consumer-smoke/src/run.ts --from packs
        if: inputs.spec == ''
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: "**/playwright-report/"
          retention-days: 7

  placeholder:
    name: placeholder through game-ci
    if: github.event_name != 'workflow_dispatch' || inputs.spec == ''
    uses: ./.github/workflows/game-ci.yml
    with:
      working-directory: games/placeholder
      sim-roots: ""
      runner: ${{ vars.AF_LINUX_RUNNER || 'af-linux' }}

  base-2d:
    name: base-2d through game-ci
    if: github.event_name != 'workflow_dispatch' || inputs.spec == ''
    uses: ./.github/workflows/game-ci.yml
    with:
      working-directory: games/emberwick
      sim-roots: src/sim
      artifact-name: base-2d-dist
      runner: ${{ vars.AF_LINUX_RUNNER || 'af-linux' }}
