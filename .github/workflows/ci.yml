name: ci

# AF's own CI (ship spec §3.7). Checks run on every push and pull request; cross-engine parity and the 2D journeys
# (Emberwick in Chromium and WebKit, the one-file examples) run on every push to main and on pull requests that are
# not drafts (a draft runs parity in a cloud container, docs/archive/cloud-parity.md). One focused browser run can be asked
# for with `automata ship test-remote <folder> <playwright args>`.
#
# What a pull request runs (CI backlog, 2026-10-23): one runner serves every pull request, so the checks job
# always runs and decides whether the pull request is documentation only (`scope`). Parity, the 2D journeys and
# Emberwick's game CI run for a pull request only when it is ready for review and changes more than docs/ and
# Markdown files; marking a draft ready starts them. Pushes to main, the nightly run and manual runs are unchanged.
#
# What it leaves to other workflows (core-and-2D refactor, spec section 3.4): the 3D and editor suites run in
# 3d-and-editors.yml, and the release-only checks (build, API report, API index, agent skills, plugin validation,
# consumer smoke) in release-checks.yml, which release-packages.yml calls before it publishes.
#
# Runners (D-5, reuse the Owner's runners): hosted jobs get no runner on this account (2026-10-11; they fail in
# about 2 s with runner_id 0), so every job runs on a self-hosted runner registered to this repository with the
# label af-linux (WSL2 Ubuntu with Docker, like Ruken's ruken-linux; ship spec §3.7). There is deliberately no
# fallback to ubuntu-latest: with no runner online a job waits in the queue instead of failing at once. The
# repository variable AF_LINUX_RUNNER switches every job to another label (ubuntu-latest once hosted minutes
# are back), and AF_GPU_RUNNER moves the browser journeys alone. Parity alone runs on the Owner's Mac (label
# af-mac, 2026-10-17) and AF_PARITY_RUNNER moves it. Until a runner serves AF, a full local run is
# the green gate (docs/archive/04-how-we-build.md).

on:
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft skips parity (below), so it runs when the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      spec:
        description: One focused browser run (test-remote) - a folder, then Playwright arguments, e.g. "games/emberwick --project=emberwick-ipad-webkit". Empty runs the checks.
        type: string
        default: ""
      nightly:
        description: Run the nightly frame-budget probe now.
        type: boolean
        default: false

permissions:
  contents: read

# A pull request's new push cancels its older run. A push to main never cancels the run in progress: with merges
# landing minutes apart, every main run was cancelled before parity finished, so main had no complete run to take
# evidence from (website DX.9w syncs the `evidence` artifact from a successful main run). GitHub keeps at most one
# pending run per group, so main's queue stays one deep: the run in progress finishes and the latest push runs next.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: lint, typecheck, boundaries, style, unit
    if: github.event_name != 'workflow_dispatch' || inputs.spec == ''
    runs-on: ${{ vars.AF_LINUX_RUNNER || 'af-linux' }}
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      parity_full: ${{ steps.scope.outputs.parity_full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so `changeset status` on a pull request can find where it left origin/main. Not an
          # expression: `cond && 0 || 1` always gives 1, because 0 is falsy in Actions expressions.
          fetch-depth: 0
      # A pull request that changes only docs/ and Markdown files cannot change what a game builds, so the jobs
      # after this one skip it. The checkout is GitHub's merge commit: its first parent is the base tip, so
      # HEAD^1..HEAD is exactly the pull request's own changes. Anything else (no merge commit, so no way to tell)
      # counts as code and runs everything.
      # parity_full (Owner, 2026-10-30: "Yes, affected-only on PRs"): the parity job runs only the suites of the
      # packages the pull request affects (turbo --affected, dependents included) when every change is inside a
      # workspace package or documentation; a change anywhere else (root config, a workflow, vendor/) is invisible
      # to turbo's package graph, so it runs every suite. Pushes to main and the nightly always run every suite.
      - id: scope
        if: github.event_name == 'pull_request'
        run: |
          docs_only=false
          parity_full=true
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            changed="$(git diff --name-only HEAD^1 HEAD)"
            if ! printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$'; then docs_only=true; fi
            if ! printf '%s\n' "$changed" | grep -qvE '^(packages|tooling|examples|games|docs)/|\.md$'; then parity_full=false; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "parity_full=$parity_full" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm style
      # QB.1 (QB spec §4.1): unused files, exports and dependencies (knip.jsonc).
      - run: pnpm knip
      - run: pnpm test:unit:core
      # QB.1: each of these first proves it fails on its planted fixture, then checks the repository. The audit is
      # `pnpm audit --prod --audit-level=high`; the secret scan runs the pinned gitleaks over the full history
      # (fetch-depth 0 above).
      - run: pnpm audit:deps
      - run: pnpm secrets
      # QB.1: every package this pull request adds that main never used, with its registry, publisher and weekly
      # downloads, in the job summary. Fails when a package or version is not on its registry.
      - run: pnpm deps:new --base origin/main
        if: github.event_name == 'pull_request'
      # Releases (M2.4 spec §3.5): a pull request that changes a published package carries a changeset, and every
      # changeset is a patch before 1.0. Each takes seconds, so a missing changeset shows here, not at publish. The
      # build, API report and the other release-only checks run in release-checks.yml.
      - run: pnpm changeset status --since=origin/main
        if: github.event_name == 'pull_request'
      - run: node tooling/release/src/check-changesets.ts

  parity:
    name: parity (chromium, webkit, firefox)
    # A draft PR runs parity in a cloud container instead (docs/archive/cloud-parity.md). Pushes to main have no
    # pull_request and always run it. `!cancelled()` keeps a red checks job from hiding parity on a push or the
    # nightly run; a pull request needs green checks first, so a red one does not also queue the heavy jobs.
    needs: checks
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.spec == '') &&
      (github.event_name != 'pull_request' ||
      (needs.checks.result == 'success' && github.event.pull_request.draft != true &&
      needs.checks.outputs.docs_only != 'true'))
    # The Owner's Mac (2026-10-17), so parity no longer queues behind Ruken on the shared af-linux PC.
    # vars.AF_PARITY_RUNNER moves it to another label.
    runs-on: ${{ vars.AF_PARITY_RUNNER || 'af-mac' }}
    timeout-minutes: 20
    # macOS runners cannot run containers, so on af-mac the job runs on the host and fetches the browsers into the
    # runner's cache (the steps below). Any other runner uses the pinned Playwright image, whose browsers and OS
    # deps come preinstalled; installing them per run there blew the 10-minute budget. An empty image runs the job
    # on the host. Keep the tag in step with the `playwright` devDependency (docs/versions.md, Container images).
    container:
      image: ${{ (vars.AF_PARITY_RUNNER || 'af-mac') != 'af-mac' && 'mcr.microsoft.com/playwright:v1.63.0-noble' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Changesets' release tags (`<package>@<version>`), from which evidence.json says which versions were
          # released (DX spec §3.10).
          fetch-tags: true
          # The merge commit and its parents, so the affected run below can compare HEAD^1..HEAD.
          fetch-depth: 2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      # The container runs as root but the checkout belongs to the runner user; without this, git (and so the
      # `prepare` hook install and `pnpm evidence`) refuses the repo as "dubious ownership". The system config,
      # not the global one: the parity and evidence steps set HOME to /root, where a global setting is not read.
      - run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
        if: runner.os == 'Linux'
      - run: pnpm install --frozen-lockfile
      # On the Mac host: a no-op once the pinned browsers are in the runner's cache.
      - run: pnpm exec playwright install chromium-headless-shell webkit firefox
        if: runner.os == 'macOS'
      # In the container Actions sets HOME to /github/home (not root's), where Firefox refuses to run as root; this
      # holds for every later step (parity and evidence). On the Mac host the runner's own HOME is right.
      - run: echo "HOME=/root" >> "$GITHUB_ENV"
        if: runner.os == 'Linux'
      # Every core and 2D package with a browsers vitest project (sim, content, ui, ...) runs its parity suite (the 3D
      # and editor packages run theirs in 3d-and-editors.yml): on
      # pushes to main, the nightly, and a pull request that changes something outside the workspace packages.
      - run: pnpm test:browser:core
        if: github.event_name != 'pull_request' || needs.checks.outputs.parity_full == 'true'
      # Any other pull request runs only the suites of the packages it affects, dependents included (turbo
      # --affected). The checkout is GitHub's merge commit, whose first parent is the base tip.
      - run: pnpm test:browser:affected
        if: github.event_name == 'pull_request' && needs.checks.outputs.parity_full != 'true'
        env:
          TURBO_SCM_BASE: HEAD^1
          TURBO_SCM_HEAD: HEAD
      # The evidence file (DX spec §3.10), on every push to main: each golden's hash as Node, Chromium, WebKit and
      # Firefox computed it, the revision, this run, and the package versions. The website reads the artifact; the
      # automata check results stay "pending" until create-game (DX.5) and automata check (DX.6) land.
      - run: pnpm evidence
        if: github.event_name == 'push'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: evidence
          path: |
            evidence.json
            evidence.schema.json
          if-no-files-found: error
          retention-days: 90
      # The container runs as root in the runner's shared work folder (/__w is _work, /__t the tool cache). Hand
      # everything back to the runner user, the owner of /__w, or the next job's checkout cannot delete the
      # root-owned node_modules ("Permission denied"). always() runs on failure and on cancel too.
      - name: Give the work folder back to the runner user
        if: always() && runner.os == 'Linux'
        run: for dir in /__w /__t; do [ ! -d "$dir" ] || chown -R "$(stat -c %u:%g /__w)" "$dir"; done

  e2e-2d:
    name: 2D journeys (Emberwick in Chromium and WebKit, the examples)
    # Emberwick's journeys at a phone, the compact height and an iPad in Chromium and WebKit (iOS Safari is WebKit),
    # and the one-file examples' journeys, each under the fake host. The input matrix inside them also runs cells in
    # WebKit and Firefox (M4.10), so all three engines are installed. Each area has its own Playwright config, so
    # this job starts only these two areas' servers. A draft skips it, like parity.
    needs: checks
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.spec == '') &&
      (github.event_name != 'pull_request' ||
      (needs.checks.result == 'success' && github.event.pull_request.draft != true &&
      needs.checks.outputs.docs_only != 'true'))
    runs-on: ${{ vars.AF_E2E_RUNNER || vars.AF_LINUX_RUNNER || 'af-linux' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
        if: runner.environment == 'github-hosted'
      # A self-hosted runner has the system libraries installed once and no sudo; the browser itself is fetched
      # into its cache here (a no-op when it is already there).
      - run: pnpm exec playwright install chromium webkit firefox
        if: runner.environment == 'self-hosted'
      - name: 2D journeys
        run: pnpm test:e2e --filter @af-games/emberwick --filter @af-examples/examples
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: "**/playwright-report/"
          retention-days: 7

  e2e-focused:
    name: one focused browser run (on request)
    # `automata ship test-remote <folder> <playwright args>`: the folder is a game or example set with its own
    # Playwright config, e.g. `games/emberwick --project=emberwick-ipad-webkit`.
    if: github.event_name == 'workflow_dispatch' && inputs.spec != ''
    runs-on: ${{ vars.AF_E2E_RUNNER || vars.AF_LINUX_RUNNER || 'af-linux' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
        if: runner.environment == 'github-hosted'
      - run: pnpm exec playwright install chromium webkit firefox
        if: runner.environment == 'self-hosted'
      - name: Browser journeys
        env:
          SPEC: ${{ inputs.spec }}
        run: |
          # SPEC is the folder, then Playwright's arguments, split on whitespace on purpose (test-remote passes
          # them through). A SPEC that matches nothing fails ("No tests found").
          folder="${SPEC%% *}"
          args="${SPEC#"$folder"}"
          cd "$folder"
          # shellcheck disable=SC2086
          pnpm exec playwright test $args
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-report
          path: "**/playwright-report/"
          retention-days: 7

  frame-budget:
    name: frame budget (nightly, GPU runner)
    # PRODUCT.7 (PRODUCT spec §2 F5): ms/frame of the core stress example's production build. A performance probe
    # needs the GPU to itself (AGENTS.md), so it runs one at a time (`concurrency`) and never beside a journey run. `pnpm budget:frame` fails closed until tooling/frame-budget/budget.json is set
    # from the first run on this runner (Owner acceptance), and on any software-rendered result.
    if: >-
      !cancelled() &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.spec == '' && inputs.nightly))
    runs-on: ${{ vars.AF_GPU_RUNNER || vars.AF_LINUX_RUNNER || 'af-linux' }}
    timeout-minutes: 20
    concurrency:
      group: af-gpu-probe
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        if: runner.environment == 'github-hosted'
      - run: pnpm exec playwright install chromium
        if: runner.environment == 'self-hosted'
      - run: pnpm test:frame-budget
      - run: pnpm budget:frame
      # The results are the evidence a budget is set from, so they are kept whatever the check said.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: frame-budget-results
          path: frame-budget-results/
          retention-days: 30

  emberwick:
    name: emberwick through game-ci
    needs: checks
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_dispatch' || inputs.spec == '') &&
      (github.event_name != 'pull_request' ||
      (needs.checks.result == 'success' && github.event.pull_request.draft != true &&
      needs.checks.outputs.docs_only != 'true'))
    uses: ./.github/workflows/game-ci.yml
    with:
      working-directory: games/emberwick
      artifact-name: emberwick-dist
      runner: ${{ vars.AF_GAME_RUNNER || vars.AF_LINUX_RUNNER || 'af-linux' }}
