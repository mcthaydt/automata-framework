name: ci

# The website's CI (QB.3f; quality-bar spec §4.2). It mirrors the framework's own ci.yml where the two overlap.
#
# Runners: GitHub-hosted Ubuntu 24.04 for every job (coordinator decision, 2026-10-23). That keeps the shared
# self-hosted runner free for Ruken and needs no runner registered to this repository. The release is pinned rather
# than `ubuntu-latest` so a runner-image change cannot move the build; it is the release the pinned Playwright image
# (noble) is built on. Moving a job back to a self-hosted label is one `runs-on` line.
#
# The framework: several tests, and the workshop the build verifies, read the framework's sources from a sibling
# checkout (`../automata-framework`). The framework repository is private, so the checkout needs the repository
# secret AF_FRAMEWORK_DEPLOY_KEY: the private half of a read-only deploy key of mcthaydt/automata-framework. A deploy
# key reads that one repository, expires never and has no scope to get wrong; the personal access token this replaced
# was a fine-grained one that GitHub answered 404 for the framework (it was not in the token's repository list).
# It is checked out at the commit in framework.ref, never at a moving branch: the site's committed data
# (src/data/projects.json, the workshop proof) was synced from that commit, so a framework change cannot turn this
# CI red on its own. Moving the pin is a deliberate change: sync the site from the new commit, then edit framework.ref.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # The website is checked out beside the framework (path: automata_website), as it is on a developer's machine.
    working-directory: automata_website

jobs:
  checks:
    name: svelte-check, build, check:site, unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automata_website
          persist-credentials: false
      - name: Read the framework pin
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < framework.ref)" >> "$GITHUB_OUTPUT"
      # A missing or wrong secret would otherwise show up as an ssh error in the middle of the checkout below.
      # The key is only ever read from the environment; nothing here prints it.
      - name: AF_FRAMEWORK_DEPLOY_KEY holds a private key
        env:
          AF_FRAMEWORK_DEPLOY_KEY: ${{ secrets.AF_FRAMEWORK_DEPLOY_KEY }}
        run: |
          if [[ -z "$AF_FRAMEWORK_DEPLOY_KEY" ]]; then
            echo "::error::AF_FRAMEWORK_DEPLOY_KEY is missing. Add a read-only deploy key of mcthaydt/automata-framework, its private half, as a secret of this repository under that name."
            exit 1
          fi
          case "$AF_FRAMEWORK_DEPLOY_KEY" in
            '-----BEGIN OPENSSH PRIVATE KEY-----'*) ;;
            *)
              echo "::error::AF_FRAMEWORK_DEPLOY_KEY does not hold a private key (an OpenSSH private key starts with -----BEGIN OPENSSH PRIVATE KEY-----). Store the private half of the deploy key, not the public half or a token."
              exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mcthaydt/automata-framework
          ref: ${{ steps.pin.outputs.ref }}
          path: automata-framework
          ssh-key: ${{ secrets.AF_FRAMEWORK_DEPLOY_KEY }}
          persist-credentials: false
          # Full history: the stack page and the evidence file are pinned to framework commits other than framework.ref.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: automata_website/.nvmrc
      # The site's tests import the framework's sources, so its dependencies must resolve. Its install scripts
      # (the git hooks) are not run: this job only reads the framework.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: automata-framework
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm check:site
      - run: pnpm test
      # The browser and Lighthouse jobs test this exact build.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-build
          path: automata_website/build
          if-no-files-found: error
          retention-days: 7

  browsers:
    name: browsers (chromium, webkit)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The browsers and their system libraries come preinstalled. Keep the tag in step with the @playwright/test
    # devDependency (tests/workflows.test.ts fails when they differ).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automata_website
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: automata_website/.nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: automata_website/build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: automata_website/test-results
          if-no-files-found: ignore
          retention-days: 14

  lighthouse:
    name: lighthouse budget
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automata_website
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: automata_website/.nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: automata_website/build
      # Lighthouse drives the image's own Chromium (the one Playwright 1.63.0 pins).
      - name: Locate Chromium
        id: chromium
        run: echo "path=$(node -e "import('@playwright/test').then(({ chromium }) => console.log(chromium.executablePath()))")" >> "$GITHUB_OUTPUT"
      - run: pnpm lighthouse
        env:
          CHROME_PATH: ${{ steps.chromium.outputs.path }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: automata_website/.lighthouseci
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
