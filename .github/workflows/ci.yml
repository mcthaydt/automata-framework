name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, boundaries, style, unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm style
      - run: pnpm test:unit

  cross-engine:
    name: parity (chromium, webkit, firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Browsers and their OS deps come preinstalled and pinned; installing them per run blew the 10-minute budget.
    # Keep the tag in step with the `playwright` devDependency.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      env:
        HOME: /root # Firefox refuses to start when $HOME isn't owned by the current (root) user
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mcthaydt/automata-sim exec vitest run --project browsers
