name: game-release

# The reusable release for a game built on AF (ship spec §3.7). A game calls it when a release is published:
#
#   on:
#     release:
#       types: [published]
#   jobs:
#     release:
#       uses: mcthaydt/automata-framework/.github/workflows/game-release.yml@main
#       with:
#         game: ${{ vars.RUKEN_GAME }}
#         ruken-api: ${{ vars.RUKEN_API }}
#         dev-target: ${{ vars.SHIP_DEV_TARGET }}
#         dev-url: ${{ vars.SHIP_DEV_URL }}
#         itch: true                            # optional: also push to itch.io (PUB spec §5)
#       secrets: inherit
#
# One build, prepared with the release tag (its version must match), then two separate jobs so one failing
# never hides the other: `ruken publish` (Ruken packs, validates and uploads; Ruken's local stack is the only
# M1 target, so hosted runners skip it unless ruken-api is a reachable Ruken) and the dev host deploy. A job
# whose secret is missing says so and stops without failing. As in game-ci.yml, the AF tools are the game's own
# dev dependencies from GitHub Packages, so a game in another repository passes AF_READ_TOKEN, a classic
# personal access token with read:packages (GitHub Packages' npm registry accepts no other kind); AF is never
# checked out.
#
# The itch job (PUB spec §5 flow 4) runs only when the caller passes `itch: true`, and never for a pull request.
# It builds the game's own itch target (`pnpm build:itch`) from the tagged commit, since a Ruken build carries
# ruken.toml and the Ruken adapter, and runs `automata-ship publish --target itch`, which checks, zips and pushes
# with butler. Unlike the jobs above, an opted-in itch job without BUTLER_API_KEY fails: the caller asked for a
# push, so a missing key is an error, not a skip.

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label for every job. GitHub's own by default, because the jobs hold the Ruken token and the dev host key, which stay off shared self-hosted runners (as Ruken keeps its publish workflows).
        type: string
        default: ubuntu-latest
      working-directory:
        type: string
        default: "."
      build-command:
        type: string
        default: pnpm build
      game:
        description: The game's Ruken public id (from its first `ruken publish`). Without it, or a committed .ruken/project.json, the Ruken job fails instead of registering a new game on every release.
        type: string
        default: ""
      ruken-api:
        description: The Ruken site to publish to. Empty skips the Ruken job.
        type: string
        default: ""
      dev-target:
        description: The dev host's ssh destination, e.g. deploy@af-dev.floorfifty.duckdns.org. Empty skips the dev host job.
        type: string
        default: ""
      dev-url:
        type: string
        default: ""
      itch:
        description: Also push to itch.io. Needs an `itch` section in ship.config.ts and the BUTLER_API_KEY secret; without the secret the itch job fails.
        type: boolean
        default: false
      itch-build-command:
        description: Builds the game for the itch target (the automata-web export condition) into dist/.
        type: string
        default: pnpm build:itch
      desktop:
        description: Also build the desktop bundles (DIST spec §6.4) on each of desktop-runners, kept as an artifact and, with itch, pushed to itch.io's Downloadable channels. Needs a `tauri` section in ship.config.ts.
        type: boolean
        default: false
      desktop-build-command:
        description: Builds the game for the tauri target (the automata-tauri export condition) into dist/.
        type: string
        default: pnpm build:tauri
      desktop-runners:
        description: The runners that build a bundle each, as a JSON list. Tauri builds only for the OS it runs on; there is no Windows runner.
        type: string
        default: '["af-linux", "af-mac"]'
      desktop-macos-runner:
        description: The Mac runner that builds the signed macOS bundle.
        type: string
        default: af-mac
      desktop-signing:
        description: Sign and notarize the macOS bundle in the release environment with the APPLE_* secrets; without one of them the job fails.
        type: boolean
        default: false
    secrets:
      RUKEN_TOKEN:
        required: false
      SHIP_DEV_SSH_KEY:
        required: false
      SHIP_DEV_KNOWN_HOSTS:
        required: false
      BUTLER_API_KEY:
        description: itch.io's butler key (`butler login`, then butler_creds). Optional at the call, but the itch job fails without it.
        required: false
      APPLE_CERTIFICATE:
        description: The Developer ID Application certificate, a base64 .p12 (desktop-signing only).
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        description: The certificate's name, such as Developer ID Application followed by your name and team id.
        required: false
      APPLE_ID:
        description: The Apple ID that notarizes.
        required: false
      APPLE_PASSWORD:
        description: An app-specific password of that Apple ID.
        required: false
      APPLE_TEAM_ID:
        required: false
      AF_READ_TOKEN:
        description: A classic personal access token with read:packages, to install AF's packages from GitHub Packages (its npm registry accepts no other kind). Not needed inside AF.
        required: false

permissions:
  contents: read

env:
  WORKDIR: ${{ inputs.working-directory }}
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: build and prepare ${{ github.ref_name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    env:
      BUILD_COMMAND: ${{ inputs.build-command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A game installs AF's packages from GitHub Packages, so without the token nothing else can work.
      - name: AF_READ_TOKEN is set
        if: github.repository != 'mcthaydt/automata-framework'
        env:
          AF_READ_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if [[ -z "$AF_READ_TOKEN" ]]; then echo "::error::AF_READ_TOKEN (a classic personal access token with read:packages) is missing"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      # registry-url and scope write an .npmrc that sends NODE_AUTH_TOKEN to GitHub Packages for @mcthaydt.
      # Inside AF every @mcthaydt package is a workspace link and the token is not needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@mcthaydt"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::error::pnpm install failed. If GitHub Packages answered 401 or 403: AF_READ_TOKEN must be a classic personal access token with read:packages (GitHub Packages' npm registry accepts no other kind)."
            exit 1
          fi
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: $BUILD_COMMAND
      - name: Prepare for Ruken (the version must match the tag)
        working-directory: ${{ inputs.working-directory }}
        run: pnpm exec automata-ship prepare --tag "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 30

  ruken:
    name: ruken publish
    needs: build
    if: inputs.ruken-api != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A game installs AF's packages from GitHub Packages, so without the token nothing else can work.
      - name: AF_READ_TOKEN is set
        if: github.repository != 'mcthaydt/automata-framework'
        env:
          AF_READ_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if [[ -z "$AF_READ_TOKEN" ]]; then echo "::error::AF_READ_TOKEN (a classic personal access token with read:packages) is missing"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      # registry-url and scope write an .npmrc that sends NODE_AUTH_TOKEN to GitHub Packages for @mcthaydt.
      # Inside AF every @mcthaydt package is a workspace link and the token is not needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@mcthaydt"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::error::pnpm install failed. If GitHub Packages answered 401 or 403: AF_READ_TOKEN must be a classic personal access token with read:packages (GitHub Packages' npm registry accepts no other kind)."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: ${{ inputs.working-directory }}/dist
      - name: Publish to Ruken
        working-directory: ${{ inputs.working-directory }}
        env:
          RUKEN_API: ${{ inputs.ruken-api }}
          RUKEN_TOKEN: ${{ secrets.RUKEN_TOKEN }}
          GAME: ${{ inputs.game }}
        run: |
          if [[ -z "$RUKEN_TOKEN" ]]; then echo "::notice::RUKEN_TOKEN is not set; skipping ruken publish"; exit 0; fi
          # ruken publish registers a new game when it knows none: from a fresh CI checkout, every release would.
          if [[ -n "$GAME" ]]; then
            pnpm exec automata-ship publish --tag "$TAG" --game "$GAME"
          elif [[ -f .ruken/project.json ]]; then
            pnpm exec automata-ship publish --tag "$TAG"
          else
            echo "::error::set the game input (the Ruken public id) or commit .ruken/project.json; refusing to register a new Ruken game"
            exit 1
          fi

  dev-host:
    name: dev host deploy
    needs: build
    if: inputs.dev-target != ''
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A game installs AF's packages from GitHub Packages, so without the token nothing else can work.
      - name: AF_READ_TOKEN is set
        if: github.repository != 'mcthaydt/automata-framework'
        env:
          AF_READ_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if [[ -z "$AF_READ_TOKEN" ]]; then echo "::error::AF_READ_TOKEN (a classic personal access token with read:packages) is missing"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      # registry-url and scope write an .npmrc that sends NODE_AUTH_TOKEN to GitHub Packages for @mcthaydt.
      # Inside AF every @mcthaydt package is a workspace link and the token is not needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@mcthaydt"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::error::pnpm install failed. If GitHub Packages answered 401 or 403: AF_READ_TOKEN must be a classic personal access token with read:packages (GitHub Packages' npm registry accepts no other kind)."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: ${{ inputs.working-directory }}/dist
      - name: Deploy to the dev host and make it live
        working-directory: ${{ inputs.working-directory }}
        env:
          SHIP_DEV_TARGET: ${{ inputs.dev-target }}
          SHIP_DEV_URL: ${{ inputs.dev-url }}
          SHIP_DEV_SSH_KEY: ${{ secrets.SHIP_DEV_SSH_KEY }}
          SHIP_DEV_KNOWN_HOSTS: ${{ secrets.SHIP_DEV_KNOWN_HOSTS }}
        run: |
          if [[ -z "$SHIP_DEV_SSH_KEY" ]]; then echo "::notice::SHIP_DEV_SSH_KEY is not set; skipping the dev host"; exit 0; fi
          # The key goes in this job's own temp folder, not the home folder's .ssh, which outlives the job on a self-hosted runner.
          keys="$RUNNER_TEMP/ship-ssh"
          install -d -m 700 "$keys"
          printf '%s\n' "$SHIP_DEV_SSH_KEY" > "$keys/id" && chmod 600 "$keys/id"
          printf '%s\n' "$SHIP_DEV_KNOWN_HOSTS" > "$keys/known_hosts"
          SHIP_DEV_SSH_KEY_FILE="$keys/id" SHIP_DEV_KNOWN_HOSTS_FILE="$keys/known_hosts" \
            pnpm exec automata-ship deploy-dev --tag "$TAG" --activate
      - name: Remove the deploy key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ship-ssh"

  itch:
    name: itch.io push
    # A pull request never pushes to itch.io, whichever event calls this workflow.
    if: inputs.itch && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      ITCH_BUILD_COMMAND: ${{ inputs.itch-build-command }}
    steps:
      # Fail closed: the caller asked for an itch.io push, so a missing key is an error, never a silent skip.
      - name: BUTLER_API_KEY is set
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo "::error::BUTLER_API_KEY is not set: add the repository secret (run butler login once, then copy the key from butler_creds; https://itch.io/docs/butler/login.html), or stop passing itch: true"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A game installs AF's packages from GitHub Packages, so without the token nothing else can work.
      - name: AF_READ_TOKEN is set
        if: github.repository != 'mcthaydt/automata-framework'
        env:
          AF_READ_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if [[ -z "$AF_READ_TOKEN" ]]; then echo "::error::AF_READ_TOKEN (a classic personal access token with read:packages) is missing"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      # registry-url and scope write an .npmrc that sends NODE_AUTH_TOKEN to GitHub Packages for @mcthaydt.
      # Inside AF every @mcthaydt package is a workspace link and the token is not needed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@mcthaydt"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::error::pnpm install failed. If GitHub Packages answered 401 or 403: AF_READ_TOKEN must be a classic personal access token with read:packages (GitHub Packages' npm registry accepts no other kind)."
            exit 1
          fi
      - name: Build for itch.io
        working-directory: ${{ inputs.working-directory }}
        run: $ITCH_BUILD_COMMAND
      # butler is pinned and checked: the archives' SHA-256 were taken from broth.itch.zone on 2026-10-16.
      # It goes in this job's temp folder, which a self-hosted runner does not keep.
      - name: Install butler (pinned)
        run: |
          BUTLER_VERSION=15.32.0
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) platform=linux-amd64; sha=2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5 ;;
            macOS-ARM64) platform=darwin-arm64; sha=f1c460f08c02686b49f8da74344e5578ece9ea1a8bae1779445b5d98e0a794b3 ;;
            *) echo "::error::no pinned butler for $RUNNER_OS-$RUNNER_ARCH; run the itch job on Linux X64 or macOS ARM64"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/butler"
          install -d "$dir"
          curl -fsSL --retry 3 -o "$dir/butler.zip" "https://broth.itch.zone/butler/$platform/$BUTLER_VERSION/archive/default"
          # macOS ships shasum, not always sha256sum.
          if command -v sha256sum >/dev/null; then
            echo "$sha  $dir/butler.zip" | sha256sum -c -
          else
            echo "$sha  $dir/butler.zip" | shasum -a 256 -c -
          fi
          unzip -q -o "$dir/butler.zip" -d "$dir"
          chmod +x "$dir/butler"
          "$dir/butler" -V
          echo "$dir" >> "$GITHUB_PATH"
      - name: Publish to itch.io
        working-directory: ${{ inputs.working-directory }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: pnpm exec automata-ship publish --target itch --tag "$TAG"
      - name: Remove butler
        if: always()
        run: rm -rf "$RUNNER_TEMP/butler"

  # DIST spec §6.4: the desktop bundles. Tauri builds only for the OS it runs on, so each runner builds its own
  # (`af-linux`: .deb and AppImage; `af-mac`: .dmg); there is no Windows runner. The runner needs Rust and, on Linux,
  # WebKitGTK 4.1 (`prepare --target tauri` names whatever is missing). Unsigned here; see desktop-macos-signed.
  desktop:
    name: desktop bundles (${{ matrix.runner }})
    if: inputs.desktop && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.desktop-runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DESKTOP_BUILD_COMMAND: ${{ inputs.desktop-build-command }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AF_READ_TOKEN is set
        if: github.repository != 'mcthaydt/automata-framework'
        env:
          AF_READ_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if [[ -z "$AF_READ_TOKEN" ]]; then echo "::error::AF_READ_TOKEN (a classic personal access token with read:packages) is missing"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@mcthaydt"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::error::pnpm install failed. If GitHub Packages answered 401 or 403: AF_READ_TOKEN must be a classic personal access token with read:packages (GitHub Packages' npm registry accepts no other kind)."
            exit 1
          fi
      - name: Build for the desktop
        working-directory: ${{ inputs.working-directory }}
        run: $DESKTOP_BUILD_COMMAND
      - name: Build the bundles (unsigned)
        working-directory: ${{ inputs.working-directory }}
        run: pnpm exec automata-ship prepare --target tauri --tag "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-unsigned-${{ matrix.runner }}
          path: ${{ inputs.working-directory }}/dist-tauri/*.*
          if-no-files-found: error
      - name: Push the bundles to itch.io (Downloadable)
        if: inputs.itch
        working-directory: ${{ inputs.working-directory }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: pnpm exec automata-ship publish --target itch --from tauri --tag "$TAG"

  # The signed macOS bundle (DIST-D8): only in the release environment, whose approval is the Owner's, with the Owner's
  # Apple secrets; tauri build signs and notarizes when they are set (https://v2.tauri.app/distribute/sign/macos/).
  desktop-macos-signed:
    name: signed macOS bundle
    if: inputs.desktop && inputs.desktop-signing && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: ${{ inputs.desktop-macos-runner }}
    environment: release
    timeout-minutes: 60
    env:
      DESKTOP_BUILD_COMMAND: ${{ inputs.desktop-build-command }}
    steps:
      # Fail closed: a missing secret would build an unsigned bundle where a signed one was asked for.
      - name: The Apple secrets are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then echo "::error::desktop-signing needs these secrets: ${missing[*]}"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: AF_READ_TOKEN is set
        if: github.repository != 'mcthaydt/automata-framework'
        env:
          AF_READ_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if [[ -z "$AF_READ_TOKEN" ]]; then echo "::error::AF_READ_TOKEN (a classic personal access token with read:packages) is missing"; exit 1; fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@mcthaydt"
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.AF_READ_TOKEN }}
        run: |
          if ! pnpm install --frozen-lockfile; then
            echo "::error::pnpm install failed. If GitHub Packages answered 401 or 403: AF_READ_TOKEN must be a classic personal access token with read:packages (GitHub Packages' npm registry accepts no other kind)."
            exit 1
          fi
      - name: Build for the desktop
        working-directory: ${{ inputs.working-directory }}
        run: $DESKTOP_BUILD_COMMAND
      - name: Build, sign and notarize the macOS bundle
        working-directory: ${{ inputs.working-directory }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec automata-ship prepare --target tauri --tag "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-signed-macos
          path: ${{ inputs.working-directory }}/dist-tauri/*.*
          if-no-files-found: error
