name: consumer smoke

# Installs AF's packed packages into a project outside the workspace and uses them as a game would: imports,
# TypeScript 7 and 6, the bins, and a Vite bundle with one Ruken SDK and no eval. It takes
# minutes, so it runs only on pull requests that touch how packages are built or published, and
# nightly and before every publish in release-checks.yml. Drafts skip it, as they skip parity and e2e;
# run it locally with `pnpm build && node tooling/consumer-smoke/src/run.ts --from packs` before marking a pull request ready.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**/tsdown.config.ts"
      - "**/tsdown.dts.config.ts"
      - "**/svelte.config.js"
      - "**/package.json"
      - pnpm-lock.yaml
      - .changeset/**
      - tooling/release/**
      - tooling/consumer-smoke/**

permissions:
  contents: read

concurrency:
  group: consumer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer-smoke:
    name: consumer smoke (packed packages, outside the workspace)
    if: github.event.pull_request.draft == false
    # The Macs, like ci.yml's checks: no container or GPU, and the PC's af-linux runners are the queue's bottleneck.
    runs-on: ${{ vars.AF_CHECKS_RUNNER || 'af-mac' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md).
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - run: pnpm install --frozen-lockfile
      # The smoke boots Chromium. A no-op once the pinned browser is in the runner's cache; on a clean machine
      # it fetches it here (Owner, 2026-10-30: "You can do all 3 as well").
      - run: pnpm exec playwright install chromium-headless-shell
      - run: pnpm build
      - run: node tooling/consumer-smoke/src/run.ts --from packs
