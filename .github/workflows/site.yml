name: site

# Deploys the website (site/) from main. Pull requests build and test the site inside ci.yml's e2e-2d job ("The
# website" step), so there is no second build or required check here: ci.yml calls this after that job passes on a
# push to main.
#
# The host is Cloudflare Pages (the Owner's call; the plan's default). Until `CLOUDFLARE_API_TOKEN` is a repository secret,
# the job prints "No host configured yet." and passes. With it, the job builds the site, holds it to `check:site` and
# `check:launch` (a personal address, Pixi 3D not public, a private repository and a domain with no mail all refuse the
# deploy), uploads `site/build/` with wrangler, and asks the live host for the headers the site means to send.

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label for the job.
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy the site
    # Main only: the token must never reach a job a pull request can start.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Is the host configured?
        id: host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No host configured yet."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.host.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.host.outputs.present == 'true'
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.host.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
      - if: steps.host.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # The build ends with the closed-beta scan; check:site holds every page and the headers file to the site's rules;
      # check:launch refuses a personal mailbox, a missing mail record, a private repository and a Pixi 3D that is not public.
      - name: Build and check the site
        if: steps.host.outputs.present == 'true'
        run: |
          pnpm exec turbo run build --filter @automata/site
          pnpm --filter @automata/site check:site
          pnpm --filter @automata/site check:launch
      # Cloudflare compresses on its own; the build's .br and .gz copies would be published as addresses of their own.
      - name: Upload site/build to Cloudflare Pages
        if: steps.host.outputs.present == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler asks its maker to count uses; a deploy from CI sends nothing.
          WRANGLER_SEND_METRICS: 'false'
        run: |
          find site/build \( -name '*.br' -o -name '*.gz' \) -delete
          pnpm --filter @automata/site exec wrangler pages deploy build --project-name automataframework --branch main 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/deploy.log" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Check the live headers
        if: steps.host.outputs.present == 'true'
        env:
          # Passed as a variable, not pasted into the script: the address comes out of a log.
          DEPLOYED_URL: ${{ steps.upload.outputs.url }}
        run: |
          pnpm --filter @automata/site check:deployed "$DEPLOYED_URL"
          pnpm --filter @automata/site check:deployed https://automataframework.com
