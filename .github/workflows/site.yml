name: site

# Deploys the website (site/) from main. Pull requests build and test the site inside ci.yml's e2e-2d job ("The
# website" step), so there is no second build or required check here: ci.yml calls this after that job passes on a
# push to main.
#
# The host is the Owner's to choose. Until its token is a repository secret, the job prints "No host configured
# yet." and passes. With the token, it first refuses to go on while Pixi 3D is still the vendored beta, then builds the
# site, refuses a personal contact address (`check:launch`: the site speaks for the project, not a person), and uploads
# `site/build/` with the host's own step, written once the host is chosen.

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label for the job.
        type: string
        required: true
    secrets:
      SITE_DEPLOY_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy the site
    # Main only: the token must never reach a job a pull request can start.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Is the host configured?
        id: host
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [[ -n "$SITE_DEPLOY_TOKEN" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No host configured yet."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.host.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.host.outputs.present == 'true'
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.host.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
      # The Owner's rule (2026-11-09): nothing is deployed while any package still takes Pixi 3D from the vendored closed
      # beta, whose terms allow no public deployment. The check reads manifests only, so it needs no install, and it has
      # no skip: the step fails until `@pixi/3d` comes from the registry.
      - name: Pixi 3D is public
        if: steps.host.outputs.present == 'true'
        run: node tooling/release/src/check-pixi3d-public.ts
      - if: steps.host.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # The build ends with the closed-beta scan; check:site holds every page to the site's rules; check:launch
      # refuses a personal mailbox.
      - name: Build and check the site
        if: steps.host.outputs.present == 'true'
        run: |
          pnpm exec turbo run build --filter @automata/site
          pnpm --filter @automata/site check:site
          pnpm --filter @automata/site check:launch
      - name: Upload site/build to the host
        if: steps.host.outputs.present == 'true'
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          echo "::error::The host's upload step is not written yet: it is added with the host (docs/runbook.md, Launch the website)."
          exit 1
