name: deploy

# The website deploy (DX.12). It publishes the build a `ci` run tested, the `site-build` artifact of that run, never a
# rebuild, and only after the run succeeded on a push to main. A release is named by its content (scripts/release.ts),
# so a release never changes once made and a rollback is choosing an earlier one (QB.4c).
#
# Today it is a dry run against a placeholder target and holds no secret: the Owner has not yet supplied a hosting
# account, a deploy credential or DNS for automata.ruken.com (decision 11), and nothing here may deploy publicly until
# then. When the host exists, one change names the target and its credential in scripts/release.ts and here, drops
# `--dry-run`, and points `check:deployed` at the origin instead of `--local`; tests/workflows.test.ts pins today's shape.
#
# The runner is the Owner's Mac (af-mac), as for ci.yml. The job runs only for pushes to main, so no pull request's
# code reaches it. One deploy runs at a time and none is cancelled midway.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  # To download the artifact of the ci run that triggered this one.
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: automata_website

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: af-mac
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: automata_website
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
          # Own folder per job: the Owner's runners share one home folder (Ruken docs/self-hosted-runner.md), and a runner's temp
          # folder is one path for all its jobs, so the folder is named by run, attempt and job (CI.WEB1).
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
      # The store gets a folder of its own too, by run, attempt and job (CI.WEB1): the runner's temp folder is the same for every job on it,
      # so nothing a job needs may live at a fixed path in it.
      - name: Give pnpm a store of its own
        run: echo "npm_config_store_dir=$RUNNER_TEMP/pnpm-store-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: automata_website/.nvmrc
      - run: bash scripts/ci/pnpm-install.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build
          path: automata_website/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: pnpm release --dry-run
      - run: pnpm check:deployed --local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: automata_website/release-manifest.json
          if-no-files-found: error
          retention-days: 90
