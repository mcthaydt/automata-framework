# A sample game's editor list, written AF-side (the game is never edited): content/tuning.toml (the Tuner, code-owned
# bounds), the `[tuning]` tables of content/modes/*.toml (tuning layers), content/stages/*.toml (routed to the 2D level
# editor, which has no profile for them), the content compiler's output in content/generated/, and `pnpm content:check`
# (package.json). The game has no gates: every row says so with `gates = []`, and there is no [[gate]].
format = "af-editors/1"
generated = ["content/generated/**"]
never = ["package.json", ".github/**", ".claude/**"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content", "content-check"]

[[file]]
glob = "content/modes/*.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content", "content-check"]

[[file]]
glob = "content/stages/*.toml"
editor = "levels-2d"
modes = ["edit"]
gates = []
checks = ["content", "content-check"]

# The try-it page's level: "New level" makes one here, and Levels writes the game's files beside it (`exports`).
[[file]]
glob = "content/levels/*.af2d.json"
editor = "levels-2d"
exports = "content"
modes = ["edit"]
gates = []
checks = []

[[check]]
id = "content-check"
run = ["pnpm", "content:check"]
