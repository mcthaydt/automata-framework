format = "af-editors/1"

# The sample game's editor list, the shape of a real 3D game's (`games/base-3d/content/editors.toml`): its room is
# edited in Levels 3D, Wick and what he is made of in Characters, the walk in the Tuner. It has no gates: every row says
# so with `gates = []`.
[[file]]
glob = "content/levels/*.af-sector.json"
editor = "levels-3d"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/figure*/*.toml"
editor = "studio"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]
