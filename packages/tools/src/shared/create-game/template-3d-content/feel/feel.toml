# What the player feels when something happens in the game. Open it in the Feel editor (`pnpm exec automata editor`).
# Wick bumping into a wall is the one thing this game says happens; add an effect to it, or answer anything else.

[[entry]]
on = "wick.bumped"
camera = [{ shake = 0.8 }]
word = [{ key = "wick.bumped.word", words = "Bump!", at = "subject" }]
