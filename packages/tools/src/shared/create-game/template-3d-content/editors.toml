format = "af-editors/1"

# The room opens in the 3D level editor (Levels 3D), Wick and what he is made of in Characters (every content/figure*
# folder: he names his swatches and gait), the walk speed in the Tuner, and what the player feels (Feel) and hears (Audio)
# when Wick bumps a wall. The game has no gates, so every row says
# `gates = []`.
[[file]]
glob = "content/levels/*.af-sector.json"
editor = "levels-3d"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/figure*/*.toml"
editor = "studio"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]

# What the player feels, the sounds and the music's order. Music is imported: the tracks a person puts in assets/music
# show up in Audio to set up.
[[file]]
glob = "content/feel/*.toml"
editor = "feel"
modes = ["edit"]
gates = []
checks = []

[[file]]
glob = "content/audio/*.toml"
editor = "audio"
modes = ["edit"]
gates = []
checks = []

[[file]]
glob = "assets/music/*"
editor = "audio"
modes = ["edit"]
gates = []
checks = []

# The words people say and the conversations they are in, which Writer edits.
[[file]]
glob = "content/lines/*.toml"
editor = "writer"
modes = ["edit"]
gates = []
checks = []

[[file]]
glob = "content/dialogue/*.toml"
editor = "writer"
modes = ["edit"]
gates = []
checks = []

# The scenes that play on their own, which Sequence edits.
[[file]]
glob = "content/cutscenes/*.toml"
editor = "sequence"
modes = ["edit"]
gates = []
checks = []

# The guard, the places he walks between, and the puzzle's facts, for Schematic.
[[file]]
glob = "content/systems/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/nav/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/puzzles/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]
