format = "af-editors/1"

# The room opens in the 3D level editor (Levels 3D), Wick and what he is made of in Characters (every content/figure*
# folder: he names his swatches and gait), and the walk speed in the Tuner. The game has no gates, so every row says
# `gates = []`.
[[file]]
glob = "content/levels/*.af-sector.json"
editor = "levels-3d"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/figure*/*.toml"
editor = "studio"
modes = ["edit"]
gates = []
checks = ["content"]

# Wick is drawn from the swatches, gait and poses beside him, so Characters reads those folders too.
[[file]]
glob = "content/figure-*/*.toml"
editor = "studio"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]
