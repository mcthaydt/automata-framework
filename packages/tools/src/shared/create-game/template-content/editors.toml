format = "af-editors/1"

# What `automata editor` opens. The level is a level project the 2D editor edits; Save also writes the game's files
# into `exports` (project.toml, world.toml, levels/<id>.toml), which the game reads.
[[file]]
glob = "content/levels/*.af2d.json"
editor = "levels-2d"
modes = ["edit"]
exports = "content"
gates = []
checks = ["content"]

# The content editors the game plays: what the player feels (Feel) and the sounds and the music's order (Audio). A file
# that is not there yet is started from its editor's page. Writer and Sequence are added to this list where the game has
# the story (a keeper who talks, a cutscene), because that is what they make.
[[file]]
glob = "content/feel/*.toml"
editor = "feel"
modes = ["edit"]
gates = []
checks = []

[[file]]
glob = "content/audio/*.toml"
editor = "audio"
modes = ["edit"]
gates = []
checks = []

# Music is imported: the tracks a person puts here show up in Audio to set up.
[[file]]
glob = "assets/music/*"
editor = "audio"
modes = ["edit"]
gates = []
checks = []

# Characters that think and the places they walk between, for Schematic. A game that plays them has the files; the rows
# wait for them here.
[[file]]
glob = "content/systems/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/nav/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/puzzles/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

# The square's speed and the game's default controls, which the Tuner edits.
[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/controls.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]
