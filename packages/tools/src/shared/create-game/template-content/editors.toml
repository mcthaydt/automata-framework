format = "af-editors/1"

# What `automata editor` opens. The level is a level project the 2D editor edits; Save also writes the game's files
# into `exports` (project.toml, world.toml, levels/<id>.toml), which the game reads.
[[file]]
glob = "content/levels/*.af2d.json"
editor = "levels-2d"
modes = ["edit"]
exports = "content"
gates = []
checks = ["content"]

# Characters and their places, for Schematic (a game that uses the systems extension). Nothing is listed until the files exist.
[[file]]
glob = "content/systems/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]

[[file]]
glob = "content/nav/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]

[[file]]
glob = "content/puzzles/*.toml"
editor = "schematic"
modes = ["edit", "ask"]
gates = []
checks = ["content"]

# The game's default controls, which the Tuner edits.
[[file]]
glob = "content/controls.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]
