format = "af-editors/1"

# What `automata editor` opens. The level is a level project the 2D editor edits; Save also writes the game's files
# into `exports` (project.toml, world.toml, levels/<id>.toml), which the game reads.
[[file]]
glob = "content/levels/*.af2d.json"
editor = "levels-2d"
modes = ["edit"]
exports = "content"
gates = []
checks = ["content"]

# Feel: what the player feels when something happens (a flash, a shake, a word over the character). A file that is not
# there yet is started from its editor's page.
[[file]]
glob = "content/feel/*.toml"
editor = "feel"
modes = ["edit"]
gates = []
checks = []

# Audio: the sounds the game plays and the order of its music.
[[file]]
glob = "content/audio/*.toml"
editor = "audio"
modes = ["edit"]
gates = []
checks = []

# Music is imported: the tracks a person puts here show up in Audio to set up.
[[file]]
glob = "assets/music/*"
editor = "audio"
modes = ["edit"]
gates = []
checks = []

# Schematic: how characters think (systems), the places they walk between (nav) and the puzzles they stand in (puzzles).
# This game has none yet; the rows are here so Schematic can save its first one.
[[file]]
glob = "content/systems/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/nav/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/puzzles/*.toml"
editor = "schematic"
modes = ["edit"]
gates = []
checks = ["content"]

# Tuner: how fast the square moves, and the game's default controls.
[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]

[[file]]
glob = "content/controls.toml"
editor = "tuner"
modes = ["edit"]
gates = []
checks = ["content"]
