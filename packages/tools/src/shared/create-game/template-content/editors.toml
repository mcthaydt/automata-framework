format = "af-editors/1"

# What `automata editor` opens. The level is a level project the 2D editor edits; Save also writes the game's files
# into `exports` (project.toml, world.toml, levels/<id>.toml), which the game reads.
[[file]]
glob = "content/levels/*.af2d.json"
editor = "levels-2d"
modes = ["edit"]
exports = "content"
gates = []
checks = ["content"]

# The content editors: what the player feels (Feel), the sounds and the music's order (Audio), the words (Writer) and
# the cutscenes (Sequence). A file that is not there yet is started from its editor's page.
[[file]]
glob = "content/feel/*.toml"
editor = "feel"
modes = ["edit", "ask"]
gates = []
checks = []

[[file]]
glob = "content/audio/*.toml"
editor = "audio"
modes = ["edit", "ask"]
gates = []
checks = []

# Music is imported: the tracks a person puts here show up in Audio to set up.
[[file]]
glob = "assets/music/*"
editor = "audio"
modes = ["edit"]
gates = []
checks = []

[[file]]
glob = "content/lines/*.toml"
editor = "writer"
modes = ["edit"]
gates = []
checks = []

[[file]]
glob = "content/dialogue/*.toml"
editor = "writer"
modes = ["edit"]
gates = []
checks = []

[[file]]
glob = "content/cutscenes/*.toml"
editor = "sequence"
modes = ["edit"]
gates = []
checks = []
