# The tutorial's stage (tutorial stage spec). Not in `catalog.toml`: no room
# can be raced here. `content/tutorial.toml` names it, and the compiler emits
# it inside the tutorial alone, so it reaches `contentRevision` only.
#
# A hazy dawn with the sun on a pyramid's apex, painted as one plate
# (`world.dawnSky`), misty teal hills that part from it as the climb goes on
# (`world.dawnMist`), black rooftops and a domed building in front
# (`world.dawnNear`), and the play layer in silhouette. The look is
# `packages/asset-contract/assets/source/dawn-concept.png`.
id = "dawn"
displayName = "Dawn"
platformAlias = "world.platform"

# Empty on purpose: the tutorial's course is `tutorial.toml`'s seed on base tuning.
[courseTuning]

[theme]
backdropAlias = "world.dawnSky"
ambienceAlias = "ambience.dawn"

# The plate's foot stands at sink 440 in the sky's units at the start of the
# climb. Measured against captures of the tutorial: it puts the plate's sun a
# third of the way down a 16:9 frame, with the fog at its foot behind the near
# rooftops.
[[theme.layers]]
alias = "world.dawnSky"
plate = "sky"
depth = 0.06
sink = 440
extend = "plate"

# The hills fade toward the sky behind them; the rooftops stand crisp.
[[theme.layers]]
alias = "world.dawnMist"
plate = "city"
depth = 0.15
sink = 240
haze = 0.3
extend = "skirt"

[[theme.layers]]
alias = "world.dawnNear"
plate = "city"
depth = 0.35
sink = 290
haze = 0
extend = "skirt"

[theme.presentation]
profile = "aquarian"
refractionIntensity = 0.45
horizonLift = 12
silhouette = true

# The tutorial's sunrise (Wonder spec §6.4): three palette steps across its
# own short course, by the same scaling, from night to day. Each stays, so the
# next steps on from it and the sunrise builds rather than resetting (owner).

[[theme.setPieces]]
floor = 15
kind = "paletteShift"
holdMs = 15000
mood = "night"
stay = true

[[theme.setPieces]]
floor = 30
kind = "paletteShift"
holdMs = 15000
mood = "dawn"
stay = true

[[theme.setPieces]]
floor = 45
kind = "paletteShift"
holdMs = 20000
mood = "day"
stay = true
