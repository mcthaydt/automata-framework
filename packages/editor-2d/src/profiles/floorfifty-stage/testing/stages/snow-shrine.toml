# A snowy night shrine: a red torii, lanterns, a moon (cover 9's mood, D-S1).
# Its floors are its own: seed 34528 from the 50-floor survey
# (packages/content/bin/survey-seeds.ts), chosen on 2026-09-30 as the calmer
# of the survey's two best (combine 0.61, finish 0.71, three laps in 45.3 s).
# seed and courseTuning reach this stage's courseRevision; the phrases reach
# contentRevision only.
id = "snow-shrine"
displayName = "Snow Shrine"
platformAlias = "world.snowShrinePlatform"

[courseTuning]

[course]
seed = 34528

[[course.phrases]]
name = "teach"
fromFloor = 1
toFloor = 5
purpose = "Short steps up the shrine stairs; the bounce carries a first-time player."

[[course.phrases]]
name = "combine"
fromFloor = 6
toFloor = 11
purpose = "Long crossings between lantern posts; the first steps that need a committed line."

[[course.phrases]]
name = "recover"
fromFloor = 12
toFloor = 15
purpose = "A breath under the torii before the climb to the moon."

[[course.phrases]]
name = "finish"
fromFloor = 16
toFloor = 19
purpose = "Sustained, demanding steps to the top; the last is makeable, not a coin flip."

# Floors 20-49, climbed by the 50-floor mode and the start of Infinite (race-options spec §4).
[[course.extension]]
fromFloor = 20
toFloor = 29
purpose = "Opens hard straight after the old finish: 20 and 21 are long crossings, then 23 and 25 settle into short hops before 27 and 29 reach out again."

[[course.extension]]
fromFloor = 30
toFloor = 39
purpose = "Floor 34 asks for a full bounce across; 31 and 33 lead into it on moving and still floors, and 35, 36 and 38 hand the breath back around one more long reach at 37."

[[course.extension]]
fromFloor = 40
toFloor = 49
purpose = "Quiet at 40 and 41, then 43 to 45 build, and the finish is the sharpest of the fifty: the moving 48 is a full-width crossing into a long 49."

# The sky plate carries the scene; snow drifts over it and the moon hangs in
# it. No middle skyline and no props: the shrine is quieter than the city.
[theme]
backdropAlias = "world.snowShrineSky"
lightAlias = "world.moon"
previewAlias = "still.snowShrinePreview"
# The bed under the race: this stage\'s own air (stage ascent spec §6).
ambienceAlias = "ambience.snowShrine"

# The layers follow the approved ascent board
# (docs/art/explorations/2026-10-01-stage-ascent/snow-shrine.png): night sky,
# far peaks and the pagoda, the cedar forest, the shrine, its details, and
# snow at two depths. The sky plate's foot stands at 200, not Dawn's 440: the
# race camera sees the sky from about -560 to +160, so at 440 only its flat
# navy top was ever on screen and the ridges never showed.
[[theme.layers]]
alias = "world.snowShrineSky"
plate = "sky"
depth = 0.06
sink = 200
extend = "plate"

# The far snow: small, slow, nearly as far away as the sky.
[[theme.layers]]
alias = "world.snowfall"
plate = "sky"
depth = 0.06
sink = 0
extend = "none"
drift = 0.6

# The depth haze on the skylines (phase 1 §2.4) keeps the scene calm and
# low-contrast right behind the platforms, as Rooftops does: the peaks most,
# the cedars half as much, the shrine not at all.
[[theme.layers]]
alias = "world.snowShrineFar"
plate = "city"
depth = 0.15
sink = 240
haze = 0.3
extend = "skirt"

[[theme.layers]]
alias = "world.snowShrineMid"
plate = "city"
depth = 0.24
sink = 270
haze = 0.15
extend = "skirt"

[[theme.layers]]
alias = "world.snowShrineNear"
plate = "city"
depth = 0.35
sink = 290
haze = 0
extend = "skirt"

[[theme.layers]]
alias = "world.snowShrineDetails"
plate = "city"
depth = 0.42
sink = 180
extend = "none"

# The near flakes last, so they fall in front of the shrine and behind the
# racers (the whole stack is behind the play field). arc = 0: snow keeps
# falling to the finish rather than sinking away with the shrine.
[[theme.layers]]
alias = "world.snowfallNear"
plate = "city"
depth = 0.5
sink = 140
extend = "none"
arc = 0
drift = 1.6

[theme.presentation]
profile = "aquarian"
refractionIntensity = 0.45
# The moon high in the night sky, as the board's last panel hangs it over the
# peaks, rather than low behind the shrine. 220, not higher: the sky drifts
# down a little as the climb goes on, and at 360 the moon only edged in under
# the timer on the last floors.
lightHeight = 220
# A moon is cold: no heat shimmer, whose wisps read as white scratches round it.
lightShimmer = false
horizonLift = 12

# The ascent arc (launch polish spec §2.8 item 11): how far the near skyline
# has fallen away below the climb by the end of each phrase. Rooftops' values
# to start, so the finish opens into the moonlit sky the board's last panel
# shows; tuned from the stage-ascent captures.
[theme.presentation.citySink]
teach = 0
combine = 40
recover = 120
finish = 560

# Set pieces (Wonder spec §6.4): the story of a climb, each placed on a
# fifty-floor race and scaled to any other (a 20-floor race plays floor 45 at
# its floor 18; Infinite repeats the arc every 50 floors). Pieces sharing a
# floor play together. Cosmetic: they reach contentRevision only.

[[theme.setPieces]]
floor = 10
kind = "paletteShift"
holdMs = 8000
mood = "bright"

[[theme.setPieces]]
floor = 22
kind = "weatherBurst"
holdMs = 7000
particle = "snow"
density = 0.6
layers = ["world.snowfall", "world.snowfallNear"]

[[theme.setPieces]]
floor = 34
kind = "weatherBurst"
holdMs = 5000
particle = "snow"
density = 0.8

[[theme.setPieces]]
floor = 34
kind = "swarm"
holdMs = 5000
layers = ["world.snowfall", "world.snowfallNear"]
speed = 10

[[theme.setPieces]]
floor = 45
kind = "weatherBurst"
holdMs = 6000
particle = "snow"
density = 1.0

[[theme.setPieces]]
floor = 45
kind = "skyFlash"
holdMs = 6000
flashes = 1
tone = "aurora"

[[theme.setPieces]]
floor = 50
kind = "paletteShift"
holdMs = 6000
mood = "aurora"

[[theme.setPieces]]
floor = 50
kind = "skyFlash"
holdMs = 6000
flashes = 1
tone = "aurora"
