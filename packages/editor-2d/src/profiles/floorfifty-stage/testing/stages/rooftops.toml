# The shipped stage.
#
# `courseTuning` is empty on purpose: the race today runs on the base layer
# alone, and an override here would change the game while claiming to describe
# it. `theme` is cosmetic and reaches `contentRevision` only.
id = "rooftops"
displayName = "Rooftops"
platformAlias = "world.platform"

[courseTuning]

# The representative course.
#
# The floors are still generated; this freezes which generation the slice
# means, so every room plays the climb the review was written about. The seed
# was chosen by measuring each candidate's horizontal demand per floor against
# what one bounce can cover, then reading the resulting arc -- see
# `docs/art/exceptional-race-slice-review.md` for the profile and the
# alternatives that were rejected.
#
# seed and courseTuning reach this stage's courseRevision (and so a replay of a race on it); the phrases reach contentRevision only.
[course]
seed = 35229

[[course.phrases]]
name = "teach"
fromFloor = 1
toFloor = 5
purpose = "Short, nearly stacked hops. Steering barely matters, so the automatic bounce and the first contact with a floor's underside are learned before anything is asked of them."

[[course.phrases]]
name = "combine"
fromFloor = 6
toFloor = 11
purpose = "Four of the six steps need most of one bounce of travel. Committing horizontally early, and holding it, is the only way across; a late correction lands short."

[[course.phrases]]
name = "recover"
fromFloor = 12
toFloor = 15
purpose = "A wide step, then a stacked pair directly overhead. A player who misses here falls to easy ground rather than out of the race, and the stack offers the side route back."

[[course.phrases]]
name = "finish"
fromFloor = 16
toFloor = 19
purpose = "One easy step to breathe, then three consecutive moving floors at near-maximum reach. The climax is legible: the floors are visibly far apart and visibly in motion."

# Floors 20-49, climbed by the 50-floor mode and the start of Infinite (race-options spec §4).
[[course.extension]]
fromFloor = 20
toFloor = 29
purpose = "A second wind past the old finish. Floor 20 and the moving 22 sit nearly overhead, then 23, 24 and 27 ask for long crossings again."

[[course.extension]]
fromFloor = 30
toFloor = 39
purpose = "The hardest ten. Floors 31, 33, 34 and 36 each ask for almost a full bounce across, with only 32 and 35, both overhead, to breathe between them."

[[course.extension]]
fromFloor = 40
toFloor = 49
purpose = "The run home eases onto moving floors and short hops, with one long reach at 44 and 46 before a near-stacked finish at 48 and 49."

[theme]
backdropAlias = "menu.backdrop"
ambienceAlias = "ambience.rooftop"

# The sun. A theme that omits it draws none; the renderer names no stage's art
# of its own.
lightAlias = "world.sun"

# The select screen's still: the wide picture its preview pans.
previewAlias = "still.rooftopsPreview"

# The scenery, back to front. depth is parallax; sink where the roofline
# starts; haze the share stippled toward the sky; arc (city only) the share of
# the ascent arc, depth / 0.35 when omitted; drift the sideways speed. A
# layer's height is its art's. Within the sky and within the city, a layer may
# not be further than the one before it.
#
# Every layer is named rather than defaulted: an omitted layer is a composition
# choice, so a theme that wants the middle skyline has to say so, and a
# misspelled alias is a build error rather than a silent omission.
#
# The sinks are deep for the reason behind the near skyline's: the accepted
# extended-stage board is sky-led, with the city holding the lower third of the
# frame and the ascent read from how much air is above it. Sinking a strip
# moves its roofline down by exactly the amount added and leaves the buildings
# their full height, which buys sky without squashing the art or moving the
# camera.

# The dawn's own sky plate (stage ascent spec §5.3): the board's streaked
# blue-to-peach, in place of the flat bands the sky shader drew. Its foot
# stands at 200, not Dawn's 440: the race camera sees the sky from about
# -560 to +160, so at 440 only the plate's top half was ever on screen and
# its peach never showed. Its edge bands repeat for tall phones.
[[theme.layers]]
alias = "world.rooftopsSky"
plate = "sky"
depth = 0.06
sink = 200
extend = "plate"

# The clouds, in three thin bands at three heights, drifting faster the nearer
# and lower they are: one band of every cloud held one height for the whole
# climb and read as a lone row across the sky (owner, 2026-10-01). Nearly as
# far away as the sky itself. No
# skirt: clouds are meant to end, and sky below a cloud is sky. Only the sky
# drifts: a skyline that drifted would read as the city sliding, and the
# details sit close enough that any movement reads as the ground moving under
# the platform a player is about to land on.
[[theme.layers]]
alias = "world.cloudsHigh"
plate = "sky"
depth = 0.06
sink = -330
extend = "none"
drift = 0.8

[[theme.layers]]
alias = "world.clouds"
plate = "sky"
depth = 0.06
sink = -140
extend = "none"
drift = 1.5

[[theme.layers]]
alias = "world.cloudsLow"
plate = "sky"
depth = 0.065
sink = 40
extend = "none"
drift = 2.2

# A few far birds, a touch nearer than the clouds and drifting a little faster
# against them: the one moving thing in an otherwise still dawn.
[[theme.layers]]
alias = "world.birds"
plate = "sky"
depth = 0.07
sink = 60
extend = "none"
drift = 0.9

# The horizon: a misted skyline on a strip of water, furthest of the city. Its
# small arc keeps it in frame to the finish, standing above the far towers as
# they sink, so the open-sky floors still have a city at their foot
# (extended-stage.png, "Open-sky finish"). Hazed most of all.
[[theme.layers]]
alias = "world.rooftopsHorizon"
plate = "city"
depth = 0.1
sink = 150
haze = 0.35
extend = "skirt"
arc = 0.05

# Atmospheric depth, per skyline: the share of each layer's texels stepped one
# swatch toward the sky, in an ordered dither baked into the art. The far city
# is hazed most and the near rooftops not at all, which is how the accepted
# extended-stage board reads distance (far ~170 luma, middle ~110, near ~45).
# Cosmetic: it reaches `contentRevision` only.
[[theme.layers]]
alias = "world.cityFar"
plate = "city"
depth = 0.15
sink = 240
haze = 0.25
extend = "skirt"

# The middle skyline the Aquarian stage adds.
[[theme.layers]]
alias = "world.cityMid"
plate = "city"
depth = 0.24
sink = 270
haze = 0.125
extend = "skirt"

[[theme.layers]]
alias = "world.cityNear"
plate = "city"
depth = 0.35
sink = 290
haze = 0
extend = "skirt"

# The near rooftops' lit windows: same depth and sink as their plate, tiled
# downward as more lit storeys.
[[theme.layers]]
alias = "world.lanterns"
plate = "city"
depth = 0.35
sink = 290
extend = "tile"

# The rooftop details strip the Aquarian stage adds, and the placeholder props
# riding it.
[[theme.layers]]
alias = "world.rooftopDetails"
plate = "city"
depth = 0.42
sink = 180
extend = "none"

[[theme.layers]]
alias = "world.rooftopProps"
plate = "city"
depth = 0.42
sink = 180
extend = "none"

# Cosmetic only, and that is the point of the table: these reach
# `contentRevision` and never `rulesetRevision`, so a room frozen on one ruleset
# plays the same race whichever of them it was authored with.
#
# `refractionIntensity` is the spec's entry value. Its profile scales the
# shader's constants by 0.45 / 0.45 / 0.5, which bounds the high profile's warp
# to about 2.7 logical units once this intensity is applied -- visibly refracted
# at rest, and not swimming while a racer steers.
[theme.presentation]
profile = "aquarian"
refractionIntensity = 0.65
# The sun just above the far horizon, where the board's finish panel shows it
# low and pale over the water.
lightHeight = 60
horizonLift = 24

# The ascent arc: how far the near skyline has fallen away below the climb by
# the end of each phrase above, in logical units; further layers fall in
# proportion to their depth. The arc, not the camera, carries the city
# (launch polish spec §2.8 item 11): the teach, combine and recover phrases
# keep the rooftops in frame, and the finish drops them out into open sky --
# the four panels of the extended-stage board, in order. Interpolated by floor
# progress, so it moves continuously across a boundary. Cosmetic: it reaches
# `contentRevision` only.
[theme.presentation.citySink]
teach = 0
combine = 40
recover = 120
finish = 560

# Set pieces (Wonder spec §6.4): the story of a climb, each placed on a
# fifty-floor race and scaled to any other (a 20-floor race plays floor 45 at
# its floor 18; Infinite repeats the arc every 50 floors). Pieces sharing a
# floor play together. Cosmetic: they reach contentRevision only.

[[theme.setPieces]]
floor = 10
kind = "swarm"
holdMs = 5000
layers = ["world.clouds", "world.cloudsHigh", "world.birds"]
speed = 8

[[theme.setPieces]]
floor = 22
kind = "lightsOut"
holdMs = 6000

[[theme.setPieces]]
floor = 34
kind = "paletteShift"
holdMs = 12000
mood = "sunset"

[[theme.setPieces]]
floor = 45
kind = "skyFlash"
holdMs = 6000
flashes = 2
tone = "lightning"
kick = 3

[[theme.setPieces]]
floor = 45
kind = "weatherBurst"
holdMs = 6000
particle = "rain"
density = 0.7

[[theme.setPieces]]
floor = 50
kind = "lightsOut"
holdMs = 4000
invert = true
