# FloorFifty's editor list, written AF-side (editor suite spec §8, decision 8: the game is never edited). Source:
# SNEKPRTY/FloorFifty at 677d456: content/tuning.toml (the Tuner, code-owned bounds), the `[tuning]` tables of
# content/modes/*.toml (tuning layers), content/stages/*.toml (the 2D level editor's FloorFifty stage profile), its
# compiler's output in content/generated/, and `pnpm content:check` (package.json). FloorFifty has no gates: every
# row says so with `gates = []`, and there is no [[gate]].
format = "af-editors/1"
generated = ["content/generated/**"]
never = ["package.json", ".github/**", ".claude/**"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit", "ask"]
gates = []
checks = ["content", "content-check"]

[[file]]
glob = "content/modes/*.toml"
editor = "tuner"
modes = ["edit", "ask"]
gates = []
checks = ["content", "content-check"]

[[file]]
glob = "content/stages/*.toml"
editor = "levels-2d"
modes = ["edit", "ask"]
gates = []
checks = ["content", "content-check"]

[[check]]
id = "content-check"
run = ["pnpm", "content:check"]
