# A sample game's editor list, written AF-side (editor suite spec §8, decision 8: the game is never edited): its tuning
# (the Tuner, code-owned bounds), tuning layers, stages routed to the 2D level editor, the compiler's output in
# content/generated/ and its `content:check` command. The game has no gates: every row says so with `gates = []`.
format = "af-editors/1"
generated = ["content/generated/**"]
never = ["package.json", ".github/**", ".claude/**"]

[[file]]
glob = "content/tuning.toml"
editor = "tuner"
modes = ["edit", "ask"]
gates = []
checks = ["content", "content-check"]

[[file]]
glob = "content/modes/*.toml"
editor = "tuner"
modes = ["edit", "ask"]
gates = []
checks = ["content", "content-check"]

[[file]]
glob = "content/stages/*.toml"
editor = "levels-2d"
modes = ["edit", "ask"]
gates = []
checks = ["content", "content-check"]

[[check]]
id = "content-check"
run = ["pnpm", "content:check"]
