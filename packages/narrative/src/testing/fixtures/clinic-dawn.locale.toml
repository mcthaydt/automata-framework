# The adventure source's clinic-dawn line text (en) (provenance: the framework's docs/provenance/sources.md), converted once
# by packages/narrative/scripts/convert-adventure-narrative.ts. Do not edit.
"clinic-dawn.exitBack" = "The door I came in by. Grey air outside, real air. Not yet. You have one more thing to write."
"clinic-dawn.receptionLocked" = "The reception door is locked. Through the glass, its key hangs on a hook on the inside, close enough to touch if the glass were not there."
"clinic-dawn.receptionOpened" = "The key turns. The door to reception swings in, slowly, as if it is letting me in on something. The register lies open on the desk."
"clinic-dawn.receptionOpen" = "The reception door stands open."
"clinic-dawn.counter" = "The counter. Behind it, on a hook by the door, the reception key. Too far to reach by hand. Everything here is just too far to reach by hand."
"clinic-dawn.counterHook" = "I reach over with the mop and lift the key off its hook. It slides down the handle to me, as if it wanted to come."
"clinic-dawn.counterEmpty" = "The hook is empty now."
"clinic-dawn.closetOpen" = "The supply room door stands open, as I left it."
"clinic-dawn.boltBack" = "I draw the bolt back. The door swings in on the grey."
"clinic-dawn.wheelchairDawn" = "The wheelchair, still turned to the wall. Nobody moved it in the night. Nobody was ever going to."
"clinic-dawn.ivStand" = "A coat hung on the drip stand, its shoulders squared on the hook, as if someone stood there watching the bed."
"clinic-dawn.bucket" = "A mop in a bucket of grey water. The handle is long. Somebody was halfway through the floor and stopped."
"clinic-dawn.bucketEmpty" = "Just the bucket now."
"clinic-dawn.trolleyKey" = "The patient record lies on the trolley, a key clipped to it. Tag: RECEPTION, in my handwriting.\nADMISSION 04:17. No name. No pulse. The patient asked us to leave the lights on."
"clinic-dawn.trolleyEmpty" = "Gauze and rust."
"clinic-dawn.bed" = "Bed 04. Made, as if nobody ever slept in it. The corners are square. You did those. Its chart is gone from the rail. You left it on the trolley."
"clinic-dawn.record" = "PATIENT RECORD\nADMISSION 04:17. No name. No pulse.\nThe patient asked us to leave the lights on."
"clinic-dawn.clock" = "The clock is moving. I had stopped expecting it to. Listen to it. It sounds like someone walking away."
"clinic-dawn.monitor" = "The monitor is dark. Grey light on the glass, and my face in it, very faint."
"clinic-dawn.cabinet" = "The key cabinet is empty. Under one hook, in pencil, in my hand: RECEPTION, on the trolley, with the record."
"clinic-dawn.curtain" = "The curtain moves a little. There is no draught. There is never a draught."
"clinic-dawn.noEffect" = "That does nothing."
"clinic-dawn.crewWheels" = "Wheels on tile, somewhere along the street. Not mine."
"clinic-dawn.crewCap" = "A peaked cap at the end of the lane. They have come about the call."
"clinic-dawn.crew.patrol.1" = "Echo Four to Control. Street’s quiet. Still looking for the patient."
"clinic-dawn.crew.patrol.2" = "Control, Echo Four. The sheet’s still open. Is anyone there?"
"clinic-dawn.crew.investigate.1" = "Echo Four to Control. Heard something by the wall. Going to look."
"clinic-dawn.crew.investigate.2" = "Hello? Is somebody there? It’s the ambulance."
"clinic-dawn.crew.hunt.1" = "There you are. Stay where you are, now. We’ll take you down."
"clinic-dawn.crew.hunt.2" = "Wait there. Nobody’s cross with you. It’s only the ambulance."
"clinic-dawn.crew.follow.1" = "Door’s open. I’ll come through after you."
"clinic-dawn.crew.follow.2" = "Easy, now. I’m only behind you."
"clinic-dawn.crew.hold.1" = "Echo Four to Control. Patient’s gone back in. We’ll wait out here."
"clinic-dawn.crew.hold.2" = "Control, Echo Four. Do you receive? Control?"
"clinic-dawn.crew.ambush.1" = "Control, Echo Four. Call 04:09, St. Agnes ward. Patient in sight."
"clinic-dawn.crew.ambush.2" = "Control, this is Echo Four. I can see the patient. Control?"
"clinic-dawn.first.vigil" = "The ward. They’ll need me. I’m late, and I am never late."
"clinic-dawn.first.between" = "It’s still here. All of it. Even the hum."
"clinic-dawn.first.release" = "I thought I’d gone. I thought that was what going meant."
"clinic-dawn.registerPage" = "NIGHT REGISTER\n20.01.87   SIGNED ON 20:00   A. Voss\nHANDED OVER TO:"
"clinic-dawn.nurse.last" = "It’s getting light. I never learned what comes after."
"clinic-dawn.registerAsk" = "A clean line under all the others. The pen is warm, as if someone just put it down."
"clinic-dawn.registerVigil" = "Back at 20:00."
"clinic-dawn.registerRelease" = "I leave the line empty."
"clinic-dawn.registerHandover" = "I write it all down."
"clinic-dawn.registerVigilSign" = "20.01.87   SIGNED ON 20:00   A. Voss"
"clinic-dawn.registerReleaseBlank" = "The line stays empty. I put the pen down. It rolls a little, and stops."
"clinic-dawn.registerHandoverWrite" = "HANDED OVER TO: the day nurse.\nTo days.\nBed 04. No name given. Asked for the lights to be left on."
"clinic-dawn.registerHandoverCall" = "04:09, a call from the ward. 04:17, found at the bed.\nNobody came to take over, so I stayed."
"clinic-dawn.registerAccountDuty" = "At 04:17 I was working."
"clinic-dawn.registerAccountUnsure" = "At 04:17 I was working, or I was asleep. I don’t remember which."
"clinic-dawn.registerAccountAsleep" = "At 04:17 I was asleep."
"clinic-dawn.registerTell" = "I wanted to tell someone first. This is me, telling you."
"clinic-dawn.registerHandoverClose" = "Lights on. Please keep them on.\nYou’ll be fine.\nA. Voss"
"clinic-dawn.st.sys.fuel.low" = "The flame is almost nothing now. The grey is coming, but not fast enough to count on."
"clinic-dawn.st.sys.grapple.nurse" = "The flame in her face, and she went back from it. It went out in my fingers. Not again so soon."
"clinic-dawn.st.sys.barricade.set" = "Across again. The bolt knows my hand by now. So does she."
"clinic-dawn.st.sys.barricade.open" = "She waits outside without a sound. Then the bolt draws itself back, and the door eases open on the grey."
"clinic-dawn.st.sys.decoy.wheelchair" = "In this light it has a shape in it, head bowed, waiting its turn. Then the grey comes up, and it is only the chair."
"clinic-dawn.st.sys.decoy.coat" = "From the bed it was someone standing over me. It is a coat. The collar is empty. There is no face above it, and there never was."
"clinic-dawn.st.p3.room.ward.vigil" = "Grey on Bed 04, and the clock out in the hall going on without me. This is when I count the beds, before handover. Somebody has to."
"clinic-dawn.st.p3.room.ward.between" = "The grey has reached the ward. Bed 04 in it, plain as a bed. Out in the hall the clock keeps going."
"clinic-dawn.st.p3.room.ward.release" = "Light in the ward. Not much. Enough to see it is only a room, and the clock out there has stopped waiting for me."
"clinic-dawn.st.p3.room.corridor" = "The grey has come down the north corridor. It is shorter than it was all night. It was always this short."
"clinic-dawn.st.p3.room.closet" = "Even the supply room has a little grey in it now. The shelves are only shelves."
"clinic-dawn.st.p3.room.reception" = "Reception, last of all. The grey comes over the counter and onto the register, and stops there, as if it is reading."
"clinic-dawn.st.p3.watch" = "The watch is going again, and it agrees with the clock on the wall. Neither of them says 04:17 any more."
"clinic-dawn.register.keyWhere" = "The reception key"
"clinic-dawn.register.mopReach" = "Out of reach, behind the counter"
"clinic-dawn.register.keyFits" = "The reception door"
"clinic-dawn.register.registerWaits" = "The night register"
"clinic-dawn.cutscene.grapple.1" = "Get back from me."
"clinic-dawn.cutscene.grappleCrew.1" = "Control, Echo Four. Patient’s on her feet, and she’s got a light. We’ll hold."
"clinic-dawn.cutscene.arrival.1" = "The street is grey and empty. At the end of it, the clinic."
"clinic-dawn.cutscene.arrival.2" = "The exit is open. Someone opened it from outside. Someone finally came."
"clinic-dawn.cutscene.arrival.3" = "The clock in the hall is ticking. The register is at reception. It is waiting."
"clinic-dawn.cutscene.finaleVigil.1" = "The grey in the windows goes back to blue. The clock reads 04:17. Of course it does."
"clinic-dawn.cutscene.finaleVigil.2" = "In the register, a new line is signed A. Voss."
"clinic-dawn.cutscene.finaleRelease.1" = "Across the bay, an ungloved hand finds her line by touch."
"clinic-dawn.cutscene.finaleRelease.2" = "There. That’s you, Drawer Four. Go on out."
"clinic-dawn.cutscene.finaleRelease.3" = "Bed 04 is made. The lighter lies on the nightstand, unlit. Nobody is keeping anything."
"clinic-dawn.cutscene.finaleHandover.1" = "Someone in the open exit. Frost on a coat. A face."
"clinic-dawn.cutscene.finaleHandover.2" = "Bed 04. No name given. Asked for the lights to be left on."
"clinic-dawn.cutscene.finaleHandover.3" = "04:09, a call from the ward. 04:17, found at the bed."
"clinic-dawn.cutscene.finaleHandover.4" = "Nobody came to take over, so I stayed. Lights on."
"clinic-dawn.cutscene.finaleHandover.5" = "I’ve got it from here. Go home, Ada."
"clinic-dawn.item.lighter.name" = "Lighter"
"clinic-dawn.item.lighter" = "A dented brass lighter. Not mine, but it fits my hand. Light it to keep her back. The fuel will not last."
"clinic-dawn.item.basin.name" = "Kidney basin"
"clinic-dawn.item.basin" = "An enamel basin. It can carry water from the sink or a puddle, and pour it anywhere."
"clinic-dawn.item.scalpel.name" = "Scalpel"
"clinic-dawn.item.scalpel" = "Clean, and very sharp. Good for cutting cloth. Not for fighting her."
"clinic-dawn.item.cloth.name" = "Curtain cloth"
"clinic-dawn.item.cloth" = "A strip of heavy shroud cotton. It could soak up water, or burn for a long time with a flame."
"clinic-dawn.item.torch.name" = "Rag torch"
"clinic-dawn.item.torch" = "Cloth wrapped around a length of pipe and set alight. A wide light that costs no fuel."
"clinic-dawn.item.bottle.name" = "Glass bottle"
"clinic-dawn.item.bottle" = "An empty saline bottle. Throw it at the floor and anything listening will come."
"clinic-dawn.item.brassKey.name" = "Brass key"
"clinic-dawn.item.brassKey" = "Paper tag: SUPPLY. It is still warm."
"clinic-dawn.item.fuse.name" = "Ceramic fuse"
"clinic-dawn.item.fuse" = "A heavy emergency fuse. The label is in my handwriting: for when I finally leave."
"clinic-dawn.item.fluid.name" = "Lighter fluid"
"clinic-dawn.item.fluid" = "Half a can of naphtha. Combine it with the lighter."
"clinic-dawn.item.matches.name" = "Matches"
"clinic-dawn.item.matches" = "A box of ambulance matches. Three left."
"clinic-dawn.item.spirit.name" = "Methylated spirit"
"clinic-dawn.item.spirit" = "A brown bottle of spirit. It burns blue and hot."
"clinic-dawn.item.petrol.name" = "Petrol can"
"clinic-dawn.item.petrol" = "A red can, a third full. It sloshes."
"clinic-dawn.item.keys.name" = "Porter’s keys"
"clinic-dawn.item.keys" = "Three keys on a ring with a brass tag: F. LAMB. The ring is ice cold."
"clinic-dawn.item.receptionKey.name" = "Reception key"
"clinic-dawn.item.receptionKey" = "A small key on a ring. Paper tag: RECEPTION."
"clinic-dawn.item.mop.name" = "Mop"
"clinic-dawn.item.mop" = "A long wooden handle, the head still wet. It reaches further than I do."
"clinic-dawn.caught.nurse.title" = "She found you."
"clinic-dawn.caught.nurse" = "Cold hands. A voice that sounds like yours: “Back to bed, Ada.”"
"clinic-dawn.caught.crew.title" = "The crew found you."
"clinic-dawn.caught.crew" = "Echo Four to Control. Patient located. Bringing her down."
"clinic-dawn.objective.register" = "Reach the register at reception."
"clinic-dawn.objective.door" = "The reception door is locked. Find its key."
"clinic-dawn.objective.write" = "Write the last line in the register."
