# `choppyLayers` from FigureBuilder (mcthaydt/FigureBuilder) src/render/figure/library/hair.json at a1f7246; swatch names in kebab-case.

about = "Straight black hair in choppy layers to the jaw, made to wear under a cap: a close shell on the round skull, lit in broken strands combed back; the sides tucked behind the ear, so the cheekbone, the jaw's corner and the ear show; behind it pointed locks to the jaw and down the back to the nape, staggered so the outline breaks into points (no level hem), each parted from the next over a dark under-layer, flaring out at their tips where a cap pushes them down and lying close bareheaded; one lock at the temple swept toward the cheekbone; bareheaded, layers from the crown whose tips stand off the shell, so the top's outline is choppy, not a dome; and a short piecey fringe that stops above the brows; under a cap the fringe pressed down to the brows and a piece out at either temple, so the hair breaks the band's line (never a beanie)."
finish = "straight"

