# A fixture clip (M3 spec §4.4.4, F-g), for tests and examples; no game's. FigureBuilder's look as data: the head
# out to one side by 0.6 s, a beat there to 1.6 s, then across to the other by 3.4 s, held until the sim stops it
# (motion.ts `lookYaw`).

length = 3.4
loop = "hold"
mask = [ "torso", "head" ]

[[keys]]
t = 0
pose = "free"

[[keys]]
t = 0.6
pose = "look-out"
ease = "out"

[[keys]]
t = 1.6
pose = "look-out"

[[keys]]
t = 3.4
pose = "look-across"
ease = "inOut"
