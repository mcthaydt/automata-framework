# A fixture clip (M3 spec §4.4.4, F-g), for tests and examples; no game's. FigureBuilder's reach as data: out over
# 0.35 of its 1.4 s, held to 0.72, back by its end (motion.ts `reachEnvelope`), from and to wherever the figure is.

length = 1.4
loop = "once"
mask = [ "armR", "torso" ]

[[keys]]
t = 0
pose = "free"

[[keys]]
t = 0.49
pose = "reach-out"
ease = "inOut"

[[keys]]
t = 1.008
pose = "reach-out"

[[keys]]
t = 1.4
pose = "free"
ease = "inOut"
