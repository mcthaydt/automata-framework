[[rules]]
id = "director"
text = "The pacing director: from 20 s into the act, tension rises with the Porter within 5 m of Ada, in the dark, on low fuel and at a crossing while he searches, and falls in the office, hidden or walking lit. Held at 0.6 for 3 s it peaks: leaving each stop, his round turns to the stop nearest Ada (P6, reordered; nothing else). Held at 0.85 for 3 s it vents into relief for up to 20 s. Under 15 s of fuel, the flame is low (system:fuel.low)."
when = []

[[rules.then]]
call = "director"

