loudness = 9
kind = "footfall"

[[rules]]
id = "crewAmbush"
text = "Once, after the first 1.5 s, with Ada past the steps (or crossing the yard) and the crew away, it appears at yardGate (the sting 0.6 s before, then a 2 s grace)."

