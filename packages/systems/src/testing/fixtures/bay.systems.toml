[[rules]]
id = "P1"
text = "Warmth draws: any flame within its reach along open ways (lighter 6 m, torch 8 m, drum or burner 12 m) brings him at 1.5 m/s, and he warms his hands there while it burns; Ada's own flame brings him to Ada (his transitions)."
when = []
then = []

[[rules]]
id = "P2"
text = "Warmth beats sound: stirring, drawn or warming, he ignores noise (his transitions hear only in routine, signing, investigate and searching)."
when = []
then = []

[[rules]]
id = "P3"
text = "Sound attracts: a noise within its loudness brings him at 1.6 m/s to search for 3 s (his transitions)."
when = []
then = []

[[rules]]
id = "P4"
text = "Blind: he has no sight. Standing still, or more than 1.8 m away, Ada is not there for him (no sight sense; the footsteps rule)."
when = []
then = []

[[rules]]
id = "P5"
text = "Touch: within 0.65 m of Ada he catches her (his transitions)."
when = []
then = []

[[rules]]
id = "grapple"
text = "The grapple: about to be caught with the lighter carried and 20 s of fuel in it, Ada gives him the flame; he cups his hands round it and warms where she stood, and lets her go. It costs 20 s of fuel (or all there is), snuffs the flame and vents the tension; for 3 s a touch is no catch, and he warms at least that long; once a minute. Nothing harms him (his transitions, src/game/grapple.ts)."
when = []
then = []

[[rules]]
id = "P6"
text = "Routine: desk (9 s, keys on the hook), oil drum, mortuary drawers (4 s), shutter, desk (his routine)."
when = []
then = []

[[rules]]
id = "P7"
text = "Keys: warmth makes him hurry and leave the keys on the hook; sound or his round, and he takes them with him (the hooks seekWarmth and takeKeys)."
when = []
then = []

[[rules]]
id = "P8"
text = "Missing keys: sitting down to an empty hook he searches: noise heard 1.5× further, his round at 1.3 m/s (his transitions)."
when = []
then = []

[[rules]]
id = "P9"
text = "Latched in: latched in the mortuary, he bangs on the door twice, then is quiet, out of play; his keys come under the door (the verb mortuaryDoor.latch)."
when = []
then = []

[[rules]]
id = "P11"
text = "Signing in: at his first sitting he signs Ada into the ledger, 17 s; his hands busy, he does not feel warmth, and a flame lit meanwhile draws him as he puts the pen down; a noise makes him look up (his transitions)."
when = []
then = []

[[rules]]
id = "P12"
text = "Slow to stir: feeling a warmth, he sniffs, turns and says so, standing still 2.5 s, then goes to it; with it gone by then, he goes back to his round (his transitions)."
when = []
then = []

[[rules]]
id = "P13"
text = "Hiding: in the ambulance cab or drawer 4 Ada is out of his reach; on his feet within 2.5 m as she climbs in, he hears it, pulls her out and reaches for her (his transitions)."
when = []
then = []

[[rules]]
id = "P10"
text = "Flames end: snuffed while he is drawn to it, he goes to where it last burned, warms 4 s, then resumes his round (his transitions)."
when = []
then = []

[[rules]]
id = "L1"
text = "Light costs fuel: the lit lighter burns its fuel; the torch burns down without fuel."

