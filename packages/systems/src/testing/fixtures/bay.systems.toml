then = []

[[rules]]
id = "footsteps"
text = "Ada's footsteps make a 1.8 m noise every 0.45 s while she walks (P4)."
when = []

[[rules.then]]
call = "footsteps"

[[rules]]
id = "crewGround"
text = "The crew's ground: only the yard (and the west doorway while Ada crosses), never the Bay's dock, office or mortuary, nor any puzzle room: a step off the yard is refused and it holds where it stands (its `refuses`, src/game/crew.ts)."
when = []
then = []

[[rules]]
id = "crewSenses"
text = "The crew sense: it hears a noise within 4 m, sees Ada past furniture (not walls) within 5 m after the first 1.5 s of the walk, and notices a lit lighter or torch within 6 m (its transitions). Light does not repel it."
when = []
then = []

[[rules]]
id = "crewTouch"
text = "Touch: within 0.62 m of Ada, on the yard, it catches her; a lifted flame stands it off (the grapple). Nothing harms it. Behind the door it holds outside, never nearer than 1.5 m (its transitions, src/game/grapple.ts)."
when = []
then = []

[[rules]]
id = "crewSteps"
text = "The crew's wheels: while it walks, they tick on the ground every 0.7 s and carry 9 m (directional sound and a wall ring; nothing hears them)."
every = 0.7

