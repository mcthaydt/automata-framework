[[rules]]
id = "R1"
text = "Light repels: the figure flees the hand lamp's light (2.2 m) to the darkest reachable node, and will not step into it (her transitions)."
when = []
then = []

[[rules]]
id = "R2"
text = "Sound attracts: a noise draws her to it (her transitions)."
when = []
then = []

[[rules]]
id = "R3"
text = "Sight hunts: in the dark she sees Ada within 4.5 m past the walls, and chases her at 2.2 m/s (her transitions)."
when = []
then = []

[[rules]]
id = "P1"
text = "Practice: her touch finds Ada; Ada is back at the lights-out checkpoint, with no caught screen and no death (her transitions; src/game/session.ts)."
when = []
then = []

[[rules]]
id = "R15"
text = "Light costs fuel: the lit lamp burns its paraffin."

[[rules.when]]
[rules.when.not]
fact = "light"
is = "off"

[[rules.then]]
call = "burnLight"

[[rules]]
id = "lightsOut"
text = "Once Bed 04 is made, every lamp goes out but Ada's, and the figure walks out of the north corridor (a checkpoint first)."

[[rules.when]]
fact = "bedMade"
is = true

[[rules.when]]
fact = "lightsOut"
is = false

[[rules.then]]
set = "lightsOut"
to = true

[[rules.then]]
call = "wake"

[[rules.then]]
[rules.then.emit]
cutscene = "lightsOut"

[[rules]]
id = "P2"
text = "The vigil: 35 s after the lights go, she goes back into the corridor unless she is hunting; then it is quiet."

[[rules.when]]
fact = "lightsOut"
is = true

[[rules.then]]
call = "vigil"

[[rules]]
id = "footsteps"
text = "Ada's footsteps make a small noise every 0.45 s while she walks."
when = []

[[rules.then]]
call = "footsteps"

