# A fixture clip (M3 spec §4.4.4, I-k), for tests and examples; no game's. An action over the whole body: down into
# a crouch by mid-roll and back up, a stand-in for a dodge roll's tuck.

length = 0.6
loop = "once"
mask = [ "root", "pelvis", "torso", "head", "armL", "armR", "legL", "legR" ]

[[keys]]
t = 0
pose = "free"

[[keys]]
t = 0.3
pose = "kneel"
ease = "out"

[[keys]]
t = 0.6
pose = "free"
ease = "in"
