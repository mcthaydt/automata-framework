# A fixture action (spec 8.3, F-g), for tests and examples; no game's. The figure source's reach as data: out over
# 0.49 s, held to 1.008 s, the action ends at 1.4 s and the pose blends back to the gait over 0.4 s, from and to
# wherever the figure is.

mask = [ "armR", "torso" ]
anticipation = 0.49
action = 0.91
recovery = 0.4

[[keys]]
t = 0.49
pose = "reach-out"
ease = "inOut"

[[keys]]
t = 1.008
pose = "reach-out"
